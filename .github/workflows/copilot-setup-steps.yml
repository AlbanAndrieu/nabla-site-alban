---
name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .python-version
      - .nvmrc
      - package.json
      - package-lock.json
      - .pre-commit-config.yaml
      - .pre-commit-pre-push.yaml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .python-version
      - .nvmrc
      - package.json
      - package-lock.json
      - .pre-commit-config.yaml
      - .pre-commit-pre-push.yaml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # If you want to clone the repository as part of your setup steps, for example to install dependencies, you'll need the `contents: read` permission. If you don't clone the repository in your setup steps, Copilot will do this for you automatically after the steps complete.
      contents: read

    # You can define any steps you want, and they will run before the agent starts.
    # If you do not check out your code, Copilot will do this for you.
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"

      - name: Restore pre-commit environments
        id: pre-commit-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-v4.6.2-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', '.python-version', '.nvmrc') }}

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check --quiet pre-commit==4.6.2

      - name: Install repository Git hooks
        shell: bash
        run: |
          set -euo pipefail
          pre-commit install --hook-type pre-commit --hook-type commit-msg
          pre-commit install --config .pre-commit-pre-push.yaml --hook-type pre-push

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".nvmrc"

      - name: Restore npm downloads
        id: npm-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Pin npm before Node-backed pre-commit bootstrap
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          npm install --global npm@11.17.0 --no-audit --no-fund
          npm --version

      - name: Prepare pre-commit hook environments
        if: steps.pre-commit-cache.outputs.cache-hit != 'true'
        run: pre-commit install-hooks

      - name: Save pre-commit environments
        if: steps.pre-commit-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-v4.6.2-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', '.python-version', '.nvmrc') }}

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Save npm downloads
        if: steps.npm-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
