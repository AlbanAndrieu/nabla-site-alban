name: Temporary PR formatter

on:
  push:
    branches:
      - chore/knip-dead-code-audit-20260908

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check --quiet pre-commit==4.6.2

      - name: Format changed files with repository hooks
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --depth=1
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/master...HEAD)
          if (("${#files[@]}" > 0)); then
            pre-commit run --hook-stage pre-commit --files "${files[@]}" --show-diff-on-failure || true
          fi
          git diff --check

      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No formatter changes"
            exit 0
          fi
          git commit -m "style: apply repository formatter"
          git push origin HEAD:chore/knip-dead-code-audit-20260908
