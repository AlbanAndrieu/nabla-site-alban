name: Production Post-deploy Smoke

on:
  repository_dispatch:
    types:
      - vercel.deployment.success
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Production Git SHA expected on the canonical www origin"
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-post-deploy-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify deployed production contract
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' &&
       github.event.client_payload.url != '' &&
       github.event.client_payload.git.sha != '' &&
       github.event.client_payload.git.ref == 'master' &&
       github.event.client_payload.environment == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: "https://www.albanandrieu.com"
      DEPLOYMENT_URL: ${{ github.event.client_payload.url || '' }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      DEPLOYED_SHA: >-
        ${{
          inputs.git_sha ||
          github.event.client_payload.git.sha ||
          github.sha
        }}

    steps:
      - name: Validate deployed SHA
        run: |
          if [[ ! "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::DEPLOYED_SHA must be a full lowercase 40-character Git SHA."
            exit 1
          fi

      - name: Checkout deployed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.DEPLOYED_SHA }}
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            scripts/post-deploy-smoke.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".nvmrc"

      - name: Prepare smoke log path
        run: echo "SMOKE_LOG=$RUNNER_TEMP/production-smoke.log" >> "$GITHUB_ENV"

      - name: Verify production HTTP and SEO contract
        run: |
          if [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            echo "::error::GitHub Actions secret VERCEL_AUTOMATION_BYPASS_SECRET is not configured."
            exit 1
          fi

          echo "Public production target: $BASE_URL"
          if [[ -n "${DEPLOYMENT_URL:-}" ]]; then
            echo "Vercel deployment evidence: $DEPLOYMENT_URL"
          fi

          set -o pipefail
          node scripts/post-deploy-smoke.mjs "$BASE_URL" 2>&1 | tee "$SMOKE_LOG"

      - name: Summarize production smoke
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Production post-deploy smoke"
            echo
            echo "- Result: **$JOB_STATUS**"
            echo "- Public target: $BASE_URL"
            echo "- Deployed SHA: $DEPLOYED_SHA"
            if [[ -n "${DEPLOYMENT_URL:-}" ]]; then
              echo "- Vercel deployment: $DEPLOYMENT_URL"
            fi
            if [[ -s "$SMOKE_LOG" ]]; then
              echo
              echo "### Smoke output"
              tail -n 80 "$SMOKE_LOG" | sed "s/^/    /"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish production smoke status
        if: always() && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ env.DEPLOYED_SHA }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$JOB_STATUS" in
            success) STATE=success; DESCRIPTION='Production post-deploy smoke passed' ;;
            cancelled) STATE=error; DESCRIPTION='Production post-deploy smoke cancelled' ;;
            *) STATE=failure; DESCRIPTION='Production post-deploy smoke failed' ;;
          esac

          payload="$(jq -n \
            --arg state "$STATE" \
            --arg target_url "$RUN_URL" \
            --arg description "$DESCRIPTION" \
            --arg context 'Production Post-deploy Smoke' \
            '{state: $state, target_url: $target_url, description: $description, context: $context}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/$STATUS_SHA" \
            --data "$payload"
