name: Temporary Biome formatter

on:
  push:
    branches:
      - chore/knip-dead-code-audit-20260908

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Format CI-reported files
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @biomejs/biome@2.4.12 check --write \
            next.config.mjs \
            unit-tests/agentQualityGate.test.ts \
            unit-tests/homelabDependencyHealth.test.ts \
            unit-tests/serviceTopology.test.ts \
            unit-tests/toolingConvergence.test.ts
          git diff --check

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add next.config.mjs unit-tests
          if git diff --cached --quiet; then
            echo "No formatter changes"
            exit 0
          fi
          git commit -m "style: apply Biome formatting"
          git push origin HEAD:chore/knip-dead-code-audit-20260908
