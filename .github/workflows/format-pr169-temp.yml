name: Temporary Biome fix PR 169

on:
  push:
    branches:
      - feat/security-merge-gates-20260909

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Apply canonical Biome formatting
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @biomejs/biome@2.4.12 check --write \
            app/components/homelab/HomelabServicesBlock.tsx \
            lib/homelabServices.ts \
            unit-tests/truenasHomelabUx.test.ts
          git diff --check

      - name: Commit formatter patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/components/homelab/HomelabServicesBlock.tsx \
            lib/homelabServices.ts \
            unit-tests/truenasHomelabUx.test.ts
          if git diff --cached --quiet; then
            echo "No formatter changes"
            exit 0
          fi
          git commit -m "style: apply canonical Biome formatting"
          git push origin HEAD:feat/security-merge-gates-20260909
