name: Temporary topology formatting

on:
  push:
    branches:
      - refactor/canonical-service-presentation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply canonical Biome formatter
        run: npx --no-install biome check --write lib/servicePresentation.ts unit-tests/servicePresentation.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/servicePresentation.ts unit-tests/servicePresentation.test.ts
          git commit -m "style(topology): apply canonical Biome formatting"
          git push
