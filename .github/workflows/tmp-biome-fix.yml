name: Temporary topology formatting

on:
  push:
    branches:
      - refactor/canonical-service-presentation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check --quiet pre-commit==4.6.2
      - name: Apply canonical Biome pre-commit hook
        continue-on-error: true
        run: pre-commit run biome-check --files lib/servicePresentation.ts unit-tests/servicePresentation.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/servicePresentation.ts unit-tests/servicePresentation.test.ts
          git commit -m "style(topology): apply canonical Biome formatting"
          git push
