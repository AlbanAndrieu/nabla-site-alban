name: Playwright Tests

on:
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

       - name: Build Next.js app
         run: npm run build

      - name: Run Playwright tests
        id: playwright
        run: npm test -- --project=chromium
        env:
          CI: true

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && !cancelled() && steps.playwright.outcome != 'skipped'
        with:
          files: test-results/junit.xml
          check_name: Playwright test results
          fail_on: "test failures"

      - name: Upload Playwright failure report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload Test Results
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Test Traces
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 30

      - name: Failure summary
        if: failure() && !cancelled()
        run: |
          echo "## Playwright tests failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the **playwright-report** artifact for the HTML report (traces, screenshots)." >> $GITHUB_STEP_SUMMARY
          echo "Download the **test-results** artifact for JUnit XML and failure artifacts." >> $GITHUB_STEP_SUMMARY
