name: Playwright Tests

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Existing deployment URL to test"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.event.deployment.id || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Playwright Tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Preview' &&
       github.event.deployment_status.environment_url != '')
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Run Playwright against deployed preview
        id: playwright
        run: npm test -- --project=chromium
        env:
          CI: true
          BASE_URL: ${{ inputs.base_url || github.event.deployment_status.environment_url }}

      - name: Upload Playwright failure report
        uses: actions/upload-artifact@v6
        if: failure() && !cancelled()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore

      - name: Failure summary
        if: failure() && !cancelled()
        run: |
          echo "## Playwright tests failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: $BASE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the **playwright-report** artifact for traces and screenshots." >> "$GITHUB_STEP_SUMMARY"
        env:
          BASE_URL: ${{ inputs.base_url || github.event.deployment_status.environment_url }}
