name: Playwright Tests

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Existing deployment URL to test"
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  # Vercel can publish several previews while a PR is updated. Keep only the
  # latest Playwright run for the deployed branch instead of one per deployment.
  group: playwright-${{ github.event.deployment.ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Playwright Tests on Preview
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment_url != '' &&
       github.event.deployment_status.environment != 'Production' &&
       github.event.deployment.ref != 'master')
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Verify protected Preview access
        env:
          BASE_URL: ${{ inputs.base_url || github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [[ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]]; then
            echo "::error::GitHub secret VERCEL_AUTOMATION_BYPASS_SECRET is required for protected Vercel Preview tests."
            echo "Generate/enable Protection Bypass for Automation in Vercel, then store the same value as the GitHub Actions secret VERCEL_AUTOMATION_BYPASS_SECRET."
            exit 1
          fi

          response_headers="$(mktemp)"
          status="$(curl --silent --show-error \
            --output /dev/null \
            --dump-header "$response_headers" \
            --write-out '%{http_code}' \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            --header 'x-vercel-set-bypass-cookie: true' \
            "$BASE_URL/")"

          if grep -Eiq '^location: https://vercel\.com/(login|sso-api)' "$response_headers" || [[ "$status" == "401" || "$status" == "403" ]]; then
            echo "::error::Vercel Preview protection bypass was rejected (HTTP $status). Verify the Vercel/GitHub automation bypass secret pair."
            exit 1
          fi

          echo "Vercel Preview access accepted (HTTP $status)."

      - name: Run Playwright against deployed preview
        id: playwright
        run: npm test -- --project=chromium
        env:
          CI: true
          BASE_URL: ${{ inputs.base_url || github.event.deployment_status.environment_url }}
          VERCEL_PREVIEW_PROTECTED: true
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload Playwright failure report
        uses: actions/upload-artifact@v6
        if: failure() && !cancelled()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore

      - name: Failure summary
        if: failure() && !cancelled()
        run: |
          echo "## Playwright tests failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: $BASE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the **playwright-report** artifact for traces and screenshots." >> "$GITHUB_STEP_SUMMARY"
        env:
          BASE_URL: ${{ inputs.base_url || github.event.deployment_status.environment_url }}

      - name: Publish Playwright Preview E2E status
        if: always() && github.event_name == 'deployment_status'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYED_SHA: ${{ github.event.deployment.sha }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$JOB_STATUS" in
            success) STATE=success; DESCRIPTION='Playwright preview tests passed' ;;
            cancelled) STATE=error; DESCRIPTION='Playwright preview tests cancelled' ;;
            *) STATE=failure; DESCRIPTION='Playwright preview tests failed' ;;
          esac

          payload="$(jq -n \
            --arg state "$STATE" \
            --arg target_url "$RUN_URL" \
            --arg description "$DESCRIPTION" \
            --arg context 'Playwright Preview E2E' \
            '{state: $state, target_url: $target_url, description: $description, context: $context}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/$DEPLOYED_SHA" \
            --data "$payload"
