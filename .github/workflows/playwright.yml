name: Playwright Tests

on:
  repository_dispatch:
    types:
      - vercel.deployment.success
  workflow_dispatch:
    inputs:
      base_url:
        description: "Existing deployment URL to test"
        required: true
        type: string
      git_sha:
        description: "Optional deployed Git SHA"
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: >-
    playwright-${{
      github.event.client_payload.git.ref ||
      github.ref
    }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Playwright Tests on Preview
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' &&
       github.event.client_payload.url != '' &&
       github.event.client_payload.git.sha != '' &&
       github.event.client_payload.git.sha != github.sha &&
       github.event.client_payload.git.ref != 'master' &&
       github.event.client_payload.environment != 'production')
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      PREVIEW_BASE_URL: >-
        ${{
          inputs.base_url ||
          github.event.client_payload.url
        }}
      DEPLOYED_SHA: >-
        ${{
          inputs.git_sha ||
          github.event.client_payload.git.sha ||
          github.sha
        }}

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOYED_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Upgrade npm
        run: npm install --global npm@11.17.0 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Verify protected Preview access
        env:
          BASE_URL: ${{ env.PREVIEW_BASE_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail

          if [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            echo "::error::GitHub Actions secret VERCEL_AUTOMATION_BYPASS_SECRET is not configured."
            exit 1
          fi

          response_headers="$(mktemp)"
          trap 'rm -f "$response_headers"' EXIT

          status="$(curl --silent --show-error \
            --output /dev/null \
            --dump-header "$response_headers" \
            --write-out '%{http_code}' \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$BASE_URL/")"
          location="$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }' "$response_headers")"

          if grep -Eiq '^location: https://vercel\.com/(login|sso-api)' "$response_headers" || \
            [[ "$status" == "401" || "$status" == "403" ]]; then
            echo "::error::Vercel rejected Protection Bypass for Automation (HTTP $status)."
            if [[ -n "$location" ]]; then
              echo "Authentication redirect: ${location%%\?*}"
            fi
            echo "::error::Confirm that the secret belongs to the Vercel project that produced this Preview deployment."
            exit 1
          fi

          echo "Vercel Preview access accepted with Protection Bypass for Automation (HTTP $status)."

      - name: Run Playwright against deployed preview
        id: playwright
        run: npm test -- --project=chromium
        env:
          CI: true
          BASE_URL: ${{ env.PREVIEW_BASE_URL }}
          VERCEL_PREVIEW_PROTECTED: true
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload Playwright failure report
        uses: actions/upload-artifact@v6
        if: failure() && !cancelled()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore

      - name: Failure summary
        if: failure() && !cancelled()
        run: |
          echo "## Playwright tests failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: $BASE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the **playwright-report** artifact for traces and screenshots when tests reached Playwright." >> "$GITHUB_STEP_SUMMARY"
        env:
          BASE_URL: ${{ env.PREVIEW_BASE_URL }}

      - name: Publish Playwright Preview E2E status
        if: always() && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ env.DEPLOYED_SHA }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$JOB_STATUS" in
            success) STATE=success; DESCRIPTION='Playwright preview tests passed' ;;
            cancelled) STATE=error; DESCRIPTION='Playwright preview tests cancelled' ;;
            *) STATE=failure; DESCRIPTION='Playwright preview tests failed' ;;
          esac

          payload="$(jq -n \
            --arg state "$STATE" \
            --arg target_url "$RUN_URL" \
            --arg description "$DESCRIPTION" \
            --arg context 'Playwright Preview E2E' \
            '{state: $state, target_url: $target_url, description: $description, context: $context}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/$STATUS_SHA" \
            --data "$payload"
