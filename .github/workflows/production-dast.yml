name: Production DAST

on:
  repository_dispatch:
    types:
      - vercel.deployment.success
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Production Git SHA to associate with this DAST run"
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-dast
  cancel-in-progress: true

jobs:
  zap-baseline:
    name: OWASP ZAP baseline on production
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' &&
       github.event.client_payload.url != '' &&
       github.event.client_payload.git.sha != '' &&
       github.event.client_payload.git.ref == 'master' &&
       github.event.client_payload.environment == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: "https://www.albanandrieu.com"
      DEPLOYED_SHA: >-
        ${{
          inputs.git_sha ||
          github.event.client_payload.git.sha ||
          github.sha
        }}

    steps:
      - name: Validate target SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::DEPLOYED_SHA must be a full lowercase 40-character Git SHA."
            exit 1
          fi

      - name: Checkout deployed ZAP policy
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOYED_SHA }}
          persist-credentials: false
          sparse-checkout: |
            .zap/rules.tsv
          sparse-checkout-cone-mode: false

      - name: Run OWASP ZAP baseline on canonical production
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ env.BASE_URL }}
          rules_file_name: ".zap/rules.tsv"
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-production-report
          cmd_options: "-I -T 5"

      - name: Summarize production DAST
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "## Production DAST"
            echo
            echo "- Result: **$JOB_STATUS**"
            echo "- Target: $BASE_URL"
            echo "- Associated SHA: $DEPLOYED_SHA"
            echo "- Scan: OWASP ZAP Baseline (passive, blocking only explicit FAIL rules)"
            echo "- Report artifact: **zap-production-report**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish production DAST status
        if: always() && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ env.DEPLOYED_SHA }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) STATE=success; DESCRIPTION='Production ZAP baseline passed' ;;
            cancelled) STATE=error; DESCRIPTION='Production ZAP baseline cancelled' ;;
            *) STATE=failure; DESCRIPTION='Production ZAP baseline failed' ;;
          esac

          payload="$(jq -n             --arg state "$STATE"             --arg target_url "$RUN_URL"             --arg description "$DESCRIPTION"             --arg context 'Production DAST'             '{state: $state, target_url: $target_url, description: $description, context: $context}')"

          curl --fail-with-body --silent --show-error             --request POST             --header "Authorization: Bearer $GH_TOKEN"             --header 'Accept: application/vnd.github+json'             --header 'X-GitHub-Api-Version: 2022-11-28'             "${{ github.api_url }}/repos/${{ github.repository }}/statuses/$STATUS_SHA"             --data "$payload"
