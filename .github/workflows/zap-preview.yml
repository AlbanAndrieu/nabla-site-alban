name: OWASP ZAP Preview

on:
  repository_dispatch:
    types:
      - vercel.deployment.success
  workflow_dispatch:
    inputs:
      base_url:
        description: "Existing exact Vercel Preview URL to scan"
        required: true
        type: string
      git_sha:
        description: "Exact deployed 40-character Git SHA"
        required: true
        type: string
      preview_ref:
        description: "Checkpoint branch, for example vercel-preview-pr-174"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: zap-preview-${{ github.event.client_payload.git.ref || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Scan exact Vercel Preview
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' &&
       github.event.client_payload.url != '' &&
       github.event.client_payload.git.sha != '' &&
       github.event.client_payload.environment != 'production' &&
       github.event.client_payload.git.ref != 'master' &&
       (startsWith(github.event.client_payload.git.ref, 'vercel-preview-pr-') ||
        startsWith(github.event.client_payload.git.ref, 'refs/heads/vercel-preview-pr-')))
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      PREVIEW_BASE_URL: ${{ inputs.base_url || github.event.client_payload.url }}
      PREVIEW_REF: ${{ inputs.preview_ref || github.event.client_payload.git.ref }}
      DEPLOYED_SHA: ${{ inputs.git_sha || github.event.client_payload.git.sha }}

    steps:
      - name: Verify Preview checkpoint exact SHA
        id: preview
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PREVIEW_REF: ${{ env.PREVIEW_REF }}
          DEPLOYED_SHA: ${{ env.DEPLOYED_SHA }}
        with:
          script: |
            const ref = process.env.PREVIEW_REF.replace(/^refs\/heads\//, '');
            const match = /^vercel-preview-pr-(\d+)$/.exec(ref);
            if (!match) {
              core.setFailed(`Unexpected Vercel Preview ref: ${process.env.PREVIEW_REF}`);
              return;
            }

            const { data: checkpoint } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${ref}`,
            });

            if (checkpoint.object.sha !== process.env.DEPLOYED_SHA) {
              core.setFailed(
                `Checkpoint ${ref} points to ${checkpoint.object.sha}, not deployed SHA ${process.env.DEPLOYED_SHA}.`,
              );
              return;
            }

            core.setOutput('pr_number', match[1]);
            core.info(
              `ZAP will scan exact checkpoint ${ref} at ${process.env.DEPLOYED_SHA}.`,
            );

      - name: Checkout exact deployed ZAP policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.DEPLOYED_SHA }}
          persist-credentials: false
          sparse-checkout: |
            .zap/rules.tsv
          sparse-checkout-cone-mode: false

      - name: Request GitHub OIDC token for Vercel
        id: vercel-oidc
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Verify protected Vercel Preview access
        id: preflight
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.vercel-oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          preview_host="${PREVIEW_BASE_URL#http://}"
          preview_host="${preview_host#https://}"
          preview_host="${preview_host%%/*}"
          case "$preview_host" in
            *.vercel.app) ;;
            *)
              echo "::error::ZAP target must be an exact Vercel deployment URL (*.vercel.app), got: $preview_host"
              exit 1
              ;;
          esac

          verify_access() {
            local auth_name="$1"
            local header_name="$2"
            local header_value="$3"
            local headers status location mitigated

            headers="$(mktemp)"
            status="$(curl --silent --show-error \
              --output /dev/null \
              --dump-header "$headers" \
              --write-out '%{http_code}' \
              --header "$header_name: $header_value" \
              "$PREVIEW_BASE_URL/")"
            location="$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }' "$headers")"
            mitigated="$(awk 'BEGIN { IGNORECASE=1 } /^x-vercel-mitigated:/ { sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }' "$headers")"

            echo "http_status=$status" >> "$GITHUB_OUTPUT"
            echo "mitigated=${mitigated:-none}" >> "$GITHUB_OUTPUT"

            if [[ "$status" == "429" || "${mitigated,,}" == "challenge" ]]; then
              echo "::warning::$auth_name reached the Vercel Security Checkpoint (HTTP $status, x-vercel-mitigated=${mitigated:-unknown})."
              rm -f "$headers"
              return 1
            fi
            if grep -Eiq '^location: https://vercel\.com/(login|sso-api)' "$headers" || \
              [[ "$status" == "401" || "$status" == "403" ]]; then
              echo "::warning::$auth_name was rejected by Vercel (HTTP $status)."
              if [[ -n "$location" ]]; then
                echo "Authentication redirect: ${location%%\?*}"
              fi
              rm -f "$headers"
              return 1
            fi
            if [[ ! "$status" =~ ^[23][0-9][0-9]$ ]]; then
              echo "::warning::$auth_name reached $preview_host but returned unexpected HTTP $status."
              rm -f "$headers"
              return 1
            fi

            {
              echo "ZAP_AUTH_HEADER=$header_name"
              echo "ZAP_AUTH_HEADER_VALUE=$header_value"
              echo "ZAP_AUTH_HEADER_SITE=$preview_host"
            } >> "$GITHUB_ENV"
            {
              echo "auth_mode=$auth_name"
              echo "host=$preview_host"
            } >> "$GITHUB_OUTPUT"
            echo "ZAP Preview access accepted with $auth_name (HTTP $status)."
            rm -f "$headers"
            return 0
          }

          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]] && verify_access \
            "Protection Bypass for Automation" \
            "x-vercel-protection-bypass" \
            "$VERCEL_AUTOMATION_BYPASS_SECRET"; then
            exit 0
          fi

          echo "::warning::Automation Bypass was unavailable or rejected; trying GitHub Actions OIDC trusted-source access."
          if [[ -n "${VERCEL_TRUSTED_OIDC_TOKEN:-}" ]] && verify_access \
            "GitHub Actions OIDC trusted source" \
            "x-vercel-trusted-oidc-idp-token" \
            "$VERCEL_TRUSTED_OIDC_TOKEN"; then
            exit 0
          fi

          echo "::error::Neither Vercel Automation Bypass nor GitHub Actions OIDC could access the exact Preview."
          exit 1

      # Do not use the upstream action: it implicitly uploads raw HTTP evidence.
      - name: Run OWASP ZAP baseline against Vercel Preview
        id: zap
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          scan_dir="$(mktemp -d "${RUNNER_TEMP}/zap-preview.XXXXXX")"
          echo "ZAP_SCAN_DIR=$scan_dir" >> "$GITHUB_ENV"
          cp .zap/rules.tsv "$scan_dir/rules.tsv"
          if ! docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env ZAP_AUTH_HEADER --env ZAP_AUTH_HEADER_VALUE --env ZAP_AUTH_HEADER_SITE \
            --volume "$scan_dir:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap-baseline.py -t "$PREVIEW_BASE_URL" -c rules.tsv \
              -J report_json.json -I -T 5 -s \
            > "$scan_dir/console.log" 2>&1; then
            echo "::error::ZAP Preview blocked or scanner failed; raw evidence withheld."
            exit 1
          fi
          test -s "$scan_dir/report_json.json" || {
            echo "::error::ZAP Preview produced no report (INCOMPLETE)."
            exit 1
          }

      - name: Summarize ZAP Preview diagnostics
        id: summary
        if: always()
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          ZAP_OUTCOME: ${{ steps.zap.outcome }}
          PREVIEW_HOST: ${{ steps.preflight.outputs.host }}
          PREFLIGHT_HTTP_STATUS: ${{ steps.preflight.outputs.http_status }}
          PREFLIGHT_MITIGATED: ${{ steps.preflight.outputs.mitigated }}
          PREFLIGHT_AUTH_MODE: ${{ steps.preflight.outputs.auth_mode }}
        shell: bash
        run: |
          set -euo pipefail
          report_state="not-produced"
          report_available=false
          high=0
          medium=0
          low=0
          informational=0

          if [[ -n "${ZAP_SCAN_DIR:-}" && -s "$ZAP_SCAN_DIR/report_json.json" ]]; then
            report_state="available"
            report_available=true
            high="$(jq '[.site[]?.alerts[]? | select(((.riskcode // "0") | tonumber) == 3)] | length' "$ZAP_SCAN_DIR/report_json.json")"
            medium="$(jq '[.site[]?.alerts[]? | select(((.riskcode // "0") | tonumber) == 2)] | length' "$ZAP_SCAN_DIR/report_json.json")"
            low="$(jq '[.site[]?.alerts[]? | select(((.riskcode // "0") | tonumber) == 1)] | length' "$ZAP_SCAN_DIR/report_json.json")"
            informational="$(jq '[.site[]?.alerts[]? | select(((.riskcode // "0") | tonumber) == 0)] | length' "$ZAP_SCAN_DIR/report_json.json")"
          fi

          {
            echo "## OWASP ZAP Preview"
            echo
            echo "- Preflight: **${PREFLIGHT_OUTCOME:-unknown}**"
            echo "- Scanner: **${ZAP_OUTCOME:-not-run}**"
            echo "- Target host: \`${PREVIEW_HOST:-unknown}\`"
            echo "- Exact SHA: \`$DEPLOYED_SHA\`"
            echo "- Preflight HTTP: \`${PREFLIGHT_HTTP_STATUS:-n/a}\`"
            echo "- Vercel mitigation: \`${PREFLIGHT_MITIGATED:-n/a}\`"
            echo "- Vercel auth: \`${PREFLIGHT_AUTH_MODE:-n/a}\`"
            echo "- Policy: \`.zap/rules.tsv\` (explicit FAIL/WARN rules)"
            echo "- Raw report: **runner-local only**, no GitHub artifact"
            echo

            if [[ "$report_state" == "available" ]]; then
              echo "### Alert classes"
              echo
              echo "| Risk | Alert types |"
              echo "| --- | ---: |"
              echo "| High | $high |"
              echo "| Medium | $medium |"
              echo "| Low | $low |"
              echo "| Informational | $informational |"
              echo
              # No title, URL, instance, cookie, or evidence in job summaries.
            else
              echo "> No \`report_json.json\` was produced. This is a scanner/configuration failure, not a zero-finding security baseline."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "report_available=$report_available"
            echo "high=$high"
            echo "medium=$medium"
            echo "low=$low"
            echo "informational=$informational"
          } >> "$GITHUB_OUTPUT"

      - name: Clean ZAP Preview workspace
        if: always()
        shell: bash
        run: |
          if [[ -n "${ZAP_SCAN_DIR:-}" ]]; then rm -rf -- "$ZAP_SCAN_DIR"; fi

      - name: Enforce ZAP Preview policy
        if: steps.preflight.outcome == 'success' && steps.zap.outcome != 'success'
        env:
          REPORT_AVAILABLE: ${{ steps.summary.outputs.report_available }}
        shell: bash
        run: |
          if [[ "$REPORT_AVAILABLE" != "true" ]]; then
            echo "::error::OWASP ZAP Preview failed before producing a report; this is a scanner/configuration error, not a security finding."
          else
            echo "::error::OWASP ZAP Preview reported a blocking finding. Review only aggregate counts in the job summary; raw evidence is never uploaded."
          fi
          exit 1

      - name: Publish ZAP Preview status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ env.DEPLOYED_SHA }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          ZAP_OUTCOME: ${{ steps.zap.outcome }}
          REPORT_AVAILABLE: ${{ steps.summary.outputs.report_available }}
          ZAP_HIGH: ${{ steps.summary.outputs.high }}
          ZAP_MEDIUM: ${{ steps.summary.outputs.medium }}
          ZAP_LOW: ${{ steps.summary.outputs.low }}
          ZAP_INFO: ${{ steps.summary.outputs.informational }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          counts="H${ZAP_HIGH:-?} M${ZAP_MEDIUM:-?} L${ZAP_LOW:-?} I${ZAP_INFO:-?}"
          if [[ "$PREFLIGHT_OUTCOME" != "success" ]]; then
            STATE=failure
            DESCRIPTION='ZAP Preview access preflight failed'
          elif [[ "$ZAP_OUTCOME" == "success" ]]; then
            STATE=success
            DESCRIPTION="ZAP Preview passed $counts"
          elif [[ "$ZAP_OUTCOME" == "cancelled" ]]; then
            STATE=error
            DESCRIPTION='ZAP Preview baseline cancelled'
          elif [[ "$REPORT_AVAILABLE" != "true" ]]; then
            STATE=error
            DESCRIPTION='ZAP Preview scanner error: no report'
          else
            STATE=failure
            DESCRIPTION="ZAP Preview blocked $counts"
          fi

          payload="$(jq -n \
            --arg state "$STATE" \
            --arg target_url "$RUN_URL" \
            --arg description "$DESCRIPTION" \
            --arg context 'OWASP ZAP Preview' \
            '{state: $state, target_url: $target_url, description: $description, context: $context}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            --data "$payload"
