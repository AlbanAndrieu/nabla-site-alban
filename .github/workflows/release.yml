name: Semantic Release

on:
  workflow_run:
    workflows:
      - CI (Quality and Security)
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: semantic-release-master
  cancel-in-progress: false

jobs:
  release:
    name: Version, changelog and GitHub release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    env:
      RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}

    steps:
      - name: Resolve release credential policy
        id: release_credentials
        env:
          RELEASE_APP_PRIVATE_KEY_CONFIGURED: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_APP_CLIENT_ID}" && "${RELEASE_APP_PRIVATE_KEY_CONFIGURED}" == "true" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "::notice::Semantic Release requires RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY; no repository mutation will be attempted with GITHUB_TOKEN."
          echo "enabled=false" >> "${GITHUB_OUTPUT}"

      - name: Report skipped semantic release
        if: steps.release_credentials.outputs.enabled != 'true'
        shell: bash
        run: |
          {
            echo "## Semantic Release"
            echo
            echo "Release mutation skipped safely."
            echo 'Configure repository variable `RELEASE_APP_CLIENT_ID` and secret `RELEASE_APP_PRIVATE_KEY`, then rerun this workflow.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout validated master revision
        if: steps.release_credentials.outputs.enabled == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Create dedicated release App token
        id: release_app_token
        if: steps.release_credentials.outputs.enabled == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Configure release Git authentication
        if: steps.release_credentials.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git

      - name: Verify validated revision is still current master
        if: steps.release_credentials.outputs.enabled == 'true'
        id: freshness
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin master:refs/remotes/origin/master --tags
          CURRENT_SHA="$(git rev-parse HEAD)"
          MASTER_SHA="$(git rev-parse origin/master)"
          VALIDATED_SHA="${{ github.event.workflow_run.head_sha }}"
          if [[ "${CURRENT_SHA}" != "${MASTER_SHA}" ]]; then
            echo "Checkout ${CURRENT_SHA} is not current master ${MASTER_SHA}."
            echo "current=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ -n "${VALIDATED_SHA}" && "${CURRENT_SHA}" != "${VALIDATED_SHA}" ]]; then
            echo "Validated revision ${VALIDATED_SHA} is stale; master is ${CURRENT_SHA}."
            echo "current=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "current=true" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        if: steps.release_credentials.outputs.enabled == 'true' && steps.freshness.outputs.current == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"

      - name: Pin npm
        if: steps.release_credentials.outputs.enabled == 'true' && steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          npm install --global npm@11.17.0 --no-audit --no-fund

      - name: Configure release Git identity
        if: steps.release_credentials.outputs.enabled == 'true' && steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bootstrap semantic-release baseline
        id: baseline
        if: steps.release_credentials.outputs.enabled == 'true' && steps.freshness.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          EXISTING_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
          if [[ -n "${EXISTING_TAG}" ]]; then
            echo "Using existing semantic-release baseline ${EXISTING_TAG}."
            echo "created=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          RELEASE_CONFIG_COMMIT="$(git log --reverse --format=%H -- .releaserc.yaml | head -n 1)"
          if [[ -z "${RELEASE_CONFIG_COMMIT}" ]]; then
            echo "Cannot locate the first semantic-release configuration commit." >&2
            exit 1
          fi

          # Keep the technical baseline immediately before semantic-release was
          # introduced so the first release analyzes only the intended migration
          # window. Creating that ref with `git push` is rejected by GitHub when
          # the already-existing target commit contains workflow files and the token
          # intentionally lacks workflow-write permission. The Git References API
          # creates only the tag ref to the existing commit and needs contents:write.
          BASELINE_SHA="$(git rev-parse "${RELEASE_CONFIG_COMMIT}^")"
          git tag v0.0.0 "${BASELINE_SHA}"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/v0.0.0" \
            -f sha="${BASELINE_SHA}" >/dev/null
          echo "Created technical baseline v0.0.0 on ${BASELINE_SHA}."
          echo "created=true" >> "${GITHUB_OUTPUT}"

      - name: Verify first-release bootstrap version
        if: steps.baseline.outputs.created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${VERSION}" != "0.0.1" ]]; then
            echo "First semantic release must bootstrap from package version 0.0.1, found ${VERSION}." >&2
            exit 1
          fi

      - name: Normalize npm lock metadata
        if: steps.release_credentials.outputs.enabled == 'true' && steps.freshness.outputs.current == 'true'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Run semantic-release
        if: steps.release_credentials.outputs.enabled == 'true' && steps.freshness.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.release_app_token.outputs.token }}
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes --ignore-scripts \
            --package=semantic-release@25.0.8 \
            --package=@semantic-release/changelog@6.0.3 \
            --package=@semantic-release/git@10.0.1 \
            --package=@semantic-release/npm@13.1.3 \
            -- semantic-release
