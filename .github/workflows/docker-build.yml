---
name: Docker CI

permissions:
  actions: read
  contents: read
  packages: write
  security-events: write

on:
  push:
    branches: [master]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "public/**"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "i18n/**"
      - "messages/**"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - "scripts/k8s/smoke-standalone.sh"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "public/**"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "i18n/**"
      - "messages/**"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - "scripts/k8s/smoke-standalone.sh"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LOCAL_IMAGE: nabla-site-alban:ci
  DOCKERHUB_IMAGE: nabla/nabla-site-alban
  GHCR_IMAGE: ghcr.io/albanandrieu/nabla-site-alban

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Build Next.js standalone image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Next.js standalone image
        id: docker_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          tags: ${{ env.LOCAL_IMAGE }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=min
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Smoke test Next.js runtime
        shell: bash
        run: bash scripts/k8s/smoke-standalone.sh "${LOCAL_IMAGE}"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          version: "v0.76.1"
          scanners: "vuln"
          format: "sarif"
          output: "trivy-results.sarif"
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Preserve Trivy SARIF report
        if: >-
          always() &&
          hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: trivy-sarif-${{ github.sha }}
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 1

      - name: Upload Trivy scan results to GitHub Code Scanning
        if: >-
          always() &&
          hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: "trivy-results.sarif"

      - name: Resolve registry publication policy
        id: registry_policy
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DOCKER_USERNAME}" && -n "${DOCKER_PASSWORD}" ]]; then
            echo "dockerhub_enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::Docker Hub credentials are not configured; publishing the validated image to GHCR only."
            echo "dockerhub_enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Login to Docker Hub
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/master' &&
          steps.registry_policy.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: true

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish validated Next.js image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          docker tag "${LOCAL_IMAGE}" "${GHCR_IMAGE}:latest"
          docker tag "${LOCAL_IMAGE}" "${GHCR_IMAGE}:${GITHUB_SHA}"
          docker push "${GHCR_IMAGE}:latest"
          docker push "${GHCR_IMAGE}:${GITHUB_SHA}"

      - name: Publish validated Next.js image to Docker Hub
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/master' &&
          steps.registry_policy.outputs.dockerhub_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker tag "${LOCAL_IMAGE}" "${DOCKERHUB_IMAGE}:latest"
          docker tag "${LOCAL_IMAGE}" "${DOCKERHUB_IMAGE}:${GITHUB_SHA}"
          docker push "${DOCKERHUB_IMAGE}:latest"
          docker push "${DOCKERHUB_IMAGE}:${GITHUB_SHA}"
