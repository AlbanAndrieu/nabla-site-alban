---
name: Docker CI

permissions:
  actions: read
  contents: read
  packages: write
  security-events: write

on:
  push:
    branches: [master]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "public/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: [master]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "public/**"
      - ".github/workflows/docker-build.yml"
  schedule:
    - cron: "0 6 * * 3"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LOCAL_IMAGE: nabla-site-alban:ci
  DOCKERHUB_IMAGE: nabla/nabla-site-alban
  GHCR_IMAGE: ghcr.io/albanandrieu/nabla-site-alban

jobs:
  build:
    name: Build static fallback
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build fallback image
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ${{ env.LOCAL_IMAGE }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Smoke test fallback container
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --rm --publish 127.0.0.1:18080:8080 "${LOCAL_IMAGE}")"
          cleanup() {
            docker stop "${container_id}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/ >/tmp/fallback-index.html; then
              break
            fi
            if [[ "${attempt}" -eq 20 ]]; then
              docker logs "${container_id}"
              exit 1
            fi
            sleep 1
          done

          grep --ignore-case --quiet "<html" /tmp/fallback-index.html
          curl --fail --silent --show-error             http://127.0.0.1:18080/404.html             --output /tmp/fallback-404.html
          grep --ignore-case --quiet "<html" /tmp/fallback-404.html

          for asset in fontawesome.js solid.js brands.js; do
            curl --fail --silent --show-error \
              "http://127.0.0.1:18080/assets/fontawesome-free-7.1.0-web/js/${asset}" \
              --output "/tmp/${asset}"
            test -s "/tmp/${asset}"
          done

          runtime_uid="$(docker exec "${container_id}" id -u)"
          if [[ "${runtime_uid}" == "0" ]]; then
            echo "Fallback container unexpectedly runs as root."
            exit 1
          fi
          echo "Fallback container smoke test passed as UID ${runtime_uid}."

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          version: "v0.74.0"
          scanners: "vuln"
          format: "sarif"
          output: "trivy-results.sarif"
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Preserve Trivy SARIF report
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@v6
        with:
          name: trivy-sarif-${{ github.sha }}
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Upload Trivy scan results to GitHub Code Scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

      - name: Resolve registry publication policy
        id: registry_policy
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DOCKER_USERNAME}" && -n "${DOCKER_PASSWORD}" ]]; then
            echo "dockerhub_enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::Docker Hub credentials are not configured; publishing the validated image to GHCR only."
            echo "dockerhub_enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Login to Docker Hub
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/master' &&
          steps.registry_policy.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: true

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish validated fallback image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          docker tag "${LOCAL_IMAGE}" "${GHCR_IMAGE}:latest"
          docker tag "${LOCAL_IMAGE}" "${GHCR_IMAGE}:${GITHUB_SHA}"
          docker push "${GHCR_IMAGE}:latest"
          docker push "${GHCR_IMAGE}:${GITHUB_SHA}"

      - name: Publish validated fallback image to Docker Hub
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/master' &&
          steps.registry_policy.outputs.dockerhub_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker tag "${LOCAL_IMAGE}" "${DOCKERHUB_IMAGE}:latest"
          docker tag "${LOCAL_IMAGE}" "${DOCKERHUB_IMAGE}:${GITHUB_SHA}"
          docker push "${DOCKERHUB_IMAGE}:latest"
          docker push "${DOCKERHUB_IMAGE}:${GITHUB_SHA}"

      - name: Image digest
        run: echo "${{ steps.docker_build.outputs.digest }}"
