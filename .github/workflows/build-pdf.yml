name: Build CV PDFs

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - "public/cv/**/*.tex"
      - "public/cv/**/*.sty"
      - "public/cv/**/*.cls"
      - ".github/workflows/build-pdf.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-cv-pdfs:
    name: Build CV PDFs (EN / FR)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install required TeX packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-luatex \
            texlive-latex-extra \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-extra-utils

      - name: Build PDF (English)
        run: latexmk -pdflua ./public/cv/cv-aandrieu-2026-en.tex -output-directory=./public/cv

      - name: Scan log (English)
        run: texloganalyser -w ./public/cv/cv-aandrieu-2026-en.log

      - name: Build PDF (French)
        run: latexmk -pdflua ./public/cv/cv-aandrieu-2026-fr.tex -output-directory=./public/cv

      - name: Scan log (French)
        run: texloganalyser -w ./public/cv/cv-aandrieu-2026-fr.log

      - name: Report rebuilt PDF drift
        if: success()
        run: |
          git status --short -- \
            ./public/cv/cv-aandrieu-2026-en.pdf \
            ./public/cv/cv-aandrieu-2026-fr.pdf >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload CV PDFs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cv-pdfs
          path: |
            ./public/cv/cv-aandrieu-2026-en.pdf
            ./public/cv/cv-aandrieu-2026-fr.pdf
          retention-days: 7

      - name: Upload logs on failure
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: cv-logs
          path: ./public/cv/*.log
          retention-days: 7
          if-no-files-found: ignore
