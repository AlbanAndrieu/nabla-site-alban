name: Build CV PDFs

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - "public/cv/**/*.tex"
      - "public/cv/**/*.sty"
      - "public/cv/**/*.cls"
      - ".github/workflows/build-pdf.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-cv-pdfs:
    name: Build CV PDFs (EN / FR)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install required TeX packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-luatex \
            texlive-latex-extra \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-extra-utils

      - name: Build PDF (English)
        run: latexmk -pdflua ./public/cv/cv-aandrieu-2026-en.tex -output-directory=./public/cv

      - name: Scan log (English)
        run: texloganalyser -w ./public/cv/cv-aandrieu-2026-en.log

      - name: Build PDF (French)
        run: latexmk -pdflua ./public/cv/cv-aandrieu-2026-fr.tex -output-directory=./public/cv

      - name: Scan log (French)
        run: texloganalyser -w ./public/cv/cv-aandrieu-2026-fr.log

      - name: Report rebuilt PDF drift
        if: success()
        run: |
          git status --short -- \
            ./public/cv/cv-aandrieu-2026-en.pdf \
            ./public/cv/cv-aandrieu-2026-fr.pdf >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload CV PDFs
        uses: actions/upload-artifact@v6
        with:
          name: cv-pdfs
          path: |
            ./public/cv/cv-aandrieu-2026-en.pdf
            ./public/cv/cv-aandrieu-2026-fr.pdf
          retention-days: 7

      - name: Upload logs on failure
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: cv-logs
          path: ./public/cv/*.log
          retention-days: 7
          if-no-files-found: ignore


  sync-cv-pdfs:
    name: Sync rebuilt CV PDFs
    needs: build-cv-pdfs
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Download rebuilt CV PDFs
        uses: actions/download-artifact@v6
        with:
          name: cv-pdfs
          path: public/cv

      - name: Commit rebuilt CV PDFs when changed
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git add --             public/cv/cv-aandrieu-2026-en.pdf             public/cv/cv-aandrieu-2026-fr.pdf
          if git diff --cached --quiet; then
            echo "Generated CV PDFs already match the branch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(cv): rebuild corrected CV PDFs"
          git push origin "HEAD:${HEAD_BRANCH}"
