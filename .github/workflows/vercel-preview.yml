name: Vercel Preview (On Demand)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to deploy after CI is validated"
        required: true
        type: number
  pull_request:
    types:
      - closed

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: >-
    vercel-preview-${{
      inputs.pr_number ||
      github.event.pull_request.number ||
      github.ref
    }}
  cancel-in-progress: true

jobs:
  checkpoint:
    name: Publish requested PR Preview checkpoint
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deploy-relevant checkpoint
        id: preview
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.state !== 'open') {
              core.setFailed(`PR #${prNumber} is not open.`);
              return;
            }
            if (pr.draft) {
              core.setFailed(`PR #${prNumber} is draft; validate it before Preview publication.`);
              return;
            }
            if (pr.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo) {
              core.setFailed('Preview checkpoints are limited to branches from this repository.');
              return;
            }

            const sha = pr.head.sha;
            const qualityRuns = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: sha,
                event: 'pull_request',
                per_page: 100,
              },
            );
            const qualityRun = qualityRuns
              .filter(
                (run) =>
                  run.name === 'CI (Quality and Security)' &&
                  run.head_sha === sha,
              )
              .sort((left, right) => right.run_number - left.run_number)[0];

            if (
              !qualityRun ||
              qualityRun.status !== 'completed' ||
              qualityRun.conclusion !== 'success'
            ) {
              core.setFailed(
                `PR #${prNumber} head ${sha} has no successful completed Quality run.`,
              );
              return;
            }
            core.info(
              `Quality run #${qualityRun.run_number} validated exact PR head ${sha}.`,
            );

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const safeOnly = (filename) =>
              filename.startsWith('docs/') ||
              filename.endsWith('.md') ||
              filename.startsWith('unit-tests/') ||
              filename.startsWith('.github/') ||
              filename.startsWith('.zap/') ||
              filename.startsWith('.vscode/') ||
              filename.startsWith('.idea/') ||
              filename.startsWith('.agents/') ||
              filename.startsWith('.cursor/') ||
              filename.startsWith('.claude/') ||
              filename === '.assetsignore' ||
              filename === '.pre-commit-config.yaml' ||
              filename === '.pre-commit-pre-push.yaml' ||
              filename === '.python-version' ||
              filename === 'mise.toml' ||
              filename === 'eslint.config.js' ||
              filename === 'stylelint.config.cjs' ||
              filename === 'scripts/agent-quality-gate.sh' ||
              filename === 'scripts/check_code_size.py' ||
              filename === 'scripts/ci-scope.sh' ||
              filename === 'scripts/verify-production-baseline.sh' ||
              filename === 'scripts/publish-vercel-preview-checkpoint.sh' ||
              filename === 'scripts/quality-gate.sh' ||
              filename === 'scripts/eslint-github-formatter.mjs';

            const deployRelevant = files
              .map((file) => file.filename)
              .filter((filename) => !safeOnly(filename));

            core.setOutput('sha', sha);
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('branch', `vercel-preview-pr-${prNumber}`);
            core.setOutput(
              'deploy_relevant',
              deployRelevant.length > 0 ? 'true' : 'false',
            );

            if (deployRelevant.length === 0) {
              core.info(
                `PR #${prNumber} only changes tests/docs/maintenance; no Vercel Preview needed.`,
              );
              return;
            }

            core.info(`Deploy-relevant files: ${deployRelevant.join(', ')}`);

      - name: Report maintenance-only Preview skip
        if: steps.preview.outputs.deploy_relevant != 'true'
        shell: bash
        run: |
          {
            echo "## On-demand Preview"
            echo
            echo "No deploy-relevant files: no Vercel checkpoint is published."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout exact PR revision
        if: steps.preview.outputs.deploy_relevant == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.preview.outputs.sha }}
          fetch-depth: 0

      - name: Publish exact-SHA Vercel Preview checkpoint
        if: steps.preview.outputs.deploy_relevant == 'true'
        env:
          CHECKPOINT_BRANCH: ${{ steps.preview.outputs.branch }}
          PR_BASE_SHA: ${{ steps.preview.outputs.base_sha }}
          PR_HEAD_SHA: ${{ steps.preview.outputs.sha }}
        shell: bash
        run: >-
          bash scripts/publish-vercel-preview-checkpoint.sh
          "${CHECKPOINT_BRANCH}" "${PR_BASE_SHA}" "${PR_HEAD_SHA}"

  cleanup:
    name: Remove closed PR Preview checkpoint
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete dedicated Preview branch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const refs = [
              `heads/vercel-preview-pr-${process.env.PR_NUMBER}`,
              `heads/vercel-preview-bootstrap-pr-${process.env.PR_NUMBER}`,
            ];

            for (const ref of refs) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref,
                });
                core.info(`Deleted ${ref}`);
              } catch (error) {
                if (error.status !== 422 && error.status !== 404) throw error;
                core.info(`${ref} does not exist; nothing to clean up.`);
              }
            }
