name: Vercel Preview (On Demand)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to deploy after CI is validated"
        required: true
        type: number
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: >-
    vercel-preview-${{
      inputs.pr_number ||
      github.event.pull_request.number ||
      github.ref
    }}
  cancel-in-progress: true

jobs:
  checkpoint:
    name: Publish requested PR Preview checkpoint
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Publish deploy-relevant checkpoint only
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.state !== 'open') {
              core.setFailed(`PR #${prNumber} is not open.`);
              return;
            }
            if (pr.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo) {
              core.setFailed('Preview checkpoints are limited to branches from this repository.');
              return;
            }

            const sha = pr.head.sha;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const safeOnly = (filename) =>
              filename.startsWith('docs/') ||
              filename.endsWith('.md') ||
              filename.startsWith('unit-tests/') ||
              filename.startsWith('.github/') ||
              filename.startsWith('.vscode/') ||
              filename.startsWith('.idea/');

            const deployRelevant = files
              .map((file) => file.filename)
              .filter((filename) => !safeOnly(filename));

            if (deployRelevant.length === 0) {
              core.info(`PR #${prNumber} only changes tests/docs/maintenance; no Vercel Preview needed.`);
              return;
            }

            core.info(`Deploy-relevant files: ${deployRelevant.join(', ')}`);
            const branch = `vercel-preview-pr-${prNumber}`;
            const ref = `heads/${branch}`;

            try {
              const current = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
              });
              if (current.data.object.sha === sha) {
                core.info(`${branch} already points to ${sha}; no new Vercel build needed.`);
                return;
              }
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                sha,
                force: true,
              });
              core.info(`Moved ${branch} to ${sha}`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/${ref}`,
                sha,
              });
              core.info(`Created ${branch} at ${sha}`);
            }

  cleanup:
    name: Remove closed PR Preview checkpoint
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete dedicated Preview branch
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const ref = `heads/vercel-preview-pr-${process.env.PR_NUMBER}`;
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
              });
              core.info(`Deleted ${ref}`);
            } catch (error) {
              if (error.status !== 422 && error.status !== 404) throw error;
              core.info(`${ref} does not exist; nothing to clean up.`);
            }
