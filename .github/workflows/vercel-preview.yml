name: Vercel Preview Checkpoint

on:
  workflow_run:
    workflows:
      - "CI (Quality and Security)"
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: vercel-preview-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  checkpoint:
    name: Publish latest validated PR SHA
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Move dedicated Vercel Preview branch
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const branch = `vercel-preview-pr-${process.env.PR_NUMBER}`;
            const ref = `heads/${branch}`;
            const sha = process.env.VALIDATED_SHA;

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
              });
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                sha,
                force: true,
              });
              core.info(`Moved ${branch} to ${sha}`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/${ref}`,
                sha,
              });
              core.info(`Created ${branch} at ${sha}`);
            }
