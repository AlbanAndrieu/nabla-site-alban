name: Temporary PR174 sync master v3

on:
  push:
    branches:
      - feat/homelab-probe-evidence-convergence

permissions:
  contents: write

concurrency:
  group: tmp-pr174-sync-master-v3
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/homelab-probe-evidence-convergence
          fetch-depth: 0
      - name: Merge exact current master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          set +e
          git merge --no-commit --no-ff FETCH_HEAD
          merge_rc=$?
          set -e
          if (( merge_rc != 0 )); then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [[ -z "${conflicts}" ]]; then
              echo 'Merge failed without a merge conflict.'
              exit "${merge_rc}"
            fi
            unexpected="$(printf '%s\n' "${conflicts}" | grep -v '^docs/homelab-roadmap.md$' || true)"
            if [[ -n "${unexpected}" ]]; then
              echo 'Unexpected merge conflicts:'
              printf '%s\n' "${unexpected}"
              exit 1
            fi
            git checkout --ours docs/homelab-roadmap.md
            git add docs/homelab-roadmap.md
          fi
          unresolved="$(git diff --name-only --diff-filter=U)"
          test -z "${unresolved}" || { printf 'Unresolved conflicts:\n%s\n' "${unresolved}"; exit 1; }
          test -f .git/MERGE_HEAD || { echo 'MERGE_HEAD missing; refusing to create a fake sync commit.'; exit 1; }
      - name: Commit real merge and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-pr174-sync-master-v3.yml
          git add -A
          git commit -m 'merge: reconcile current master into PR 174'
          parents="$(git show -s --format='%P' HEAD)"
          test "$(wc -w <<<"${parents}")" -eq 2 || { echo "Expected two parents, got: ${parents}"; exit 1; }
          git push origin HEAD:feat/homelab-probe-evidence-convergence
