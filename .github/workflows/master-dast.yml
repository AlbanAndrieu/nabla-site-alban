name: Production DAST

on:
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Production Git SHA to associate with this DAST run"
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-dast
  cancel-in-progress: true

jobs:
  zap-baseline:
    name: OWASP ZAP baseline on production
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: "https://www.albanandrieu.com"
      DEPLOYED_SHA: >-
        ${{
          inputs.git_sha ||
          github.event.client_payload.git.sha ||
          github.sha
        }}

    steps:
      - name: Validate target SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::DEPLOYED_SHA must be a full lowercase 40-character Git SHA."
            exit 1
          fi

      - name: Checkout deployed ZAP policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.DEPLOYED_SHA }}
          persist-credentials: false
          sparse-checkout: |
            .zap/rules.tsv
            scripts/security/minimize-zap-report.mjs
          sparse-checkout-cone-mode: false

      - name: Verify production DAST can reach the application
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is required for production DAST."
            exit 1
          fi
          response_headers="$(mktemp)"
          trap 'rm -f "$response_headers"' EXIT
          status="$(curl --silent --show-error --output /dev/null --dump-header "$response_headers" --write-out '%{http_code}' --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$BASE_URL/")"
          mitigated="$(awk 'BEGIN { IGNORECASE=1 } /^x-vercel-mitigated:/ { sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }' "$response_headers")"
          if [[ "$status" != "200" || "${mitigated,,}" == "challenge" ]]; then
            echo "::error::Production DAST preflight did not reach the application (HTTP $status, x-vercel-mitigated=${mitigated:-none})."
            exit 1
          fi

      # Do not use zaproxy/action-baseline here: it uploads raw HTTP evidence
      # before any producer-side redaction. The bounded CLI run writes locally
      # and only the strict High-rule-ID/public-origin projection leaves runner.
      - name: Run OWASP ZAP baseline on canonical production
        shell: bash
        env:
          ZAP_AUTH_HEADER: x-vercel-protection-bypass
          ZAP_AUTH_HEADER_VALUE: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ZAP_AUTH_HEADER_SITE: www.albanandrieu.com
        run: |
          set -euo pipefail
          scan_dir="$(mktemp -d "${RUNNER_TEMP}/zap-production.XXXXXX")"
          echo "ZAP_SCAN_DIR=$scan_dir" >> "$GITHUB_ENV"
          cp .zap/rules.tsv "$scan_dir/rules.tsv"
          # No raw ZAP stdout, JSON, HTML, cookies or request/response bodies
          # may reach job logs, summary, CI artifacts, or DefectDojo.
          if ! docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env ZAP_AUTH_HEADER --env ZAP_AUTH_HEADER_VALUE --env ZAP_AUTH_HEADER_SITE \
            --volume "$scan_dir:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap-baseline.py -t "$BASE_URL" -c rules.tsv \
              -J report_json.json -I -T 5 -m 2 -a -s \
            > "$scan_dir/console.log" 2>&1; then
            echo "::error::ZAP production failed (policy finding or scanner failure); raw HTTP evidence withheld."
            exit 1
          fi
          test -s "$scan_dir/report_json.json" || {
            echo "::error::ZAP completed without a report (INCOMPLETE)."
            exit 1
          }
          node scripts/security/minimize-zap-report.mjs \
            "$scan_dir/report_json.json" "$scan_dir/report_json.safe.json"
          mkdir -p zap-production-safe
          mv "$scan_dir/report_json.safe.json" zap-production-safe/report_json.json

      - name: Upload only sanitized production ZAP findings
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zap-production-report
          path: zap-production-safe/report_json.json
          retention-days: 3
          if-no-files-found: error

      - name: Clean ZAP production workspace
        if: always()
        shell: bash
        run: |
          if [[ -n "${ZAP_SCAN_DIR:-}" ]]; then rm -rf -- "$ZAP_SCAN_DIR"; fi
          rm -rf zap-production-safe

      - name: Summarize production DAST
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "## Production DAST"
            echo
            echo "- Result: **$JOB_STATUS**"
            echo "- Target: $BASE_URL"
            echo "- Associated SHA: $DEPLOYED_SHA"
            echo "- Scan: OWASP ZAP Baseline (passive, blocking only explicit FAIL rules)"
            echo "- Report artifact: **zap-production-report**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish production DAST status
        if: always() && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ env.DEPLOYED_SHA }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) STATE=success; DESCRIPTION='Production ZAP baseline passed' ;;
            cancelled) STATE=error; DESCRIPTION='Production ZAP baseline cancelled' ;;
            *) STATE=failure; DESCRIPTION='Production ZAP baseline failed' ;;
          esac

          payload="$(jq -n \
            --arg state "$STATE" \
            --arg target_url "$RUN_URL" \
            --arg description "$DESCRIPTION" \
            --arg context 'Production DAST' \
            '{state: $state, target_url: $target_url, description: $description, context: $context}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/$STATUS_SHA" \
            --data "$payload"
