name: Nuclei public DAST (Site Alban)

on:
  workflow_dispatch:
  schedule:
    - cron: "19 4 * * 1"

permissions:
  contents: read

concurrency:
  group: nuclei-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-dast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install pinned Nuclei with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/nuclei.zip"
          curl --fail --location --silent --show-error --max-time 90 \
            "https://github.com/projectdiscovery/nuclei/releases/download/v3.11.1/nuclei_3.11.1_linux_amd64.zip" \
            --output "$archive"
          printf '%s  %s\n' \
            'ea63d4ae232808cd7c6bc00d0142428e231fab59dae01042246097d195835ab6' "$archive" \
            | sha256sum --check --status
          unzip -p "$archive" nuclei > "${RUNNER_TEMP}/nuclei"
          chmod 700 "${RUNNER_TEMP}/nuclei"
          "${RUNNER_TEMP}/nuclei" -version
          # Template update is separate from the binary release and is mandatory.
          "${RUNNER_TEMP}/nuclei" -ut
          test -d "${HOME}/nuclei-templates" || {
            echo "::error::Nuclei templates missing after bootstrap."
            exit 1
          }

      - name: Scan public website (bounded HTTP templates)
        id: nuclei
        shell: bash
        env:
          NUCLEI_DISABLE_UPDATE_CHECK: "true"
          NUCLEI_NO_COLOR: "true"
        run: |
          set -euo pipefail
          mkdir -p nuclei-results
          # No credentials, fuzzing, OAST, headless browser or network discovery.
          # Cost/load budget: narrow the weekly profile to actionable medium+ findings.
          # Full-template scans must be an explicitly approved separate workflow.
          # Cap concurrency and rate to reduce load on production and Cloudflare.
          excludes=()
          while IFS= read -r id; do
            [[ "$id" =~ ^#.*$ || -z "$id" ]] && continue
            if [[ ! "$id" =~ ^[a-zA-Z0-9_-]+$ ]]; then
              echo "::error::Invalid Nuclei exclusion template ID"
              exit 2
            fi
            excludes+=("$id")
          done < .nuclei/ignore-templates.txt
          exclusion_args=()
          if (( ${#excludes[@]} )); then
            joined="$(IFS=,; echo "${excludes[*]}")"
            exclusion_args=(-eid "$joined")
          fi
          "${RUNNER_TEMP}/nuclei" \
            -u https://albanandrieu.com \
            -pt http -ni \
            -tags cve,misconfig,exposure \
            -severity medium,high,critical \
            -etags dos,fuzz,bruteforce,intrusive \
            -rl 2 -c 1 -timeout 5 -retries 0 \
            -duc -jsonl -o nuclei-results/nuclei.raw.jsonl \
            "${exclusion_args[@]}"
          test -f nuclei-results/nuclei.raw.jsonl || : > nuclei-results/nuclei.raw.jsonl
          node scripts/security/minimize-nuclei-report.mjs nuclei-results/nuclei.raw.jsonl nuclei-results/nuclei.jsonl
          node scripts/nuclei-to-sarif.mjs nuclei-results/nuclei.jsonl nuclei-results/nuclei.sarif

      - name: Summarize Nuclei findings and reviewed exclusions
        if: always()
        shell: bash
        env:
          SCAN_OUTCOME: ${{ steps.nuclei.outcome }}
        run: |
          if [[ "$SCAN_OUTCOME" != "success" ]]; then
            echo "## Nuclei public DAST — INCOMPLETE / NOT_RUN" >> "$GITHUB_STEP_SUMMARY"
            echo "Scan did not complete successfully (failed, canceled or not started); partial or empty results are not zero findings." >> "$GITHUB_STEP_SUMMARY"
          else
            node scripts/nuclei-summary.mjs nuclei-results/nuclei.raw.jsonl .nuclei/ignore-templates.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Delete raw Nuclei HTTP evidence before uploading artifacts
        if: always()
        shell: bash
        run: rm -f nuclei-results/nuclei.raw.jsonl

      - name: Upload scan report (restricted artifact lifetime)
        if: always() && hashFiles('nuclei-results/nuclei.jsonl') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nuclei-public-${{ github.run_id }}
          path: |
            nuclei-results/nuclei.jsonl
            nuclei-results/nuclei.sarif
          retention-days: 3
          if-no-files-found: error

      # DefectDojo is private-only. A GitHub-hosted runner must not upload
      # directly to .int endpoints or receive a broad DefectDojo API token.
      # The allowlisted, read-only TrueNAS collector pulls approved master
      # artifacts by workflow/run/SHA and imports only selected severities.
