name: CI (Quality and Security)

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "i18n/**"
      - "lib/**"
      - "messages/**"
      - "public/**/*.css"
      - "public/robots.txt"
      - "scripts/**"
      - "tests/**"
      - "unit-tests/**"
      - "*.{js,cjs,mjs,ts,json}"
      - "package-lock.json"
      - "CHANGELOG.md"
      - ".releaserc.yaml"
      - ".npmrc"
      - ".nvmrc"
      - ".envrc"
      - "mise.toml"
      - "AGENTS.md"
      - ".pre-commit-config.yaml"
      - ".pre-commit-pre-push.yaml"
      - ".github/copilot-instructions.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/copilot-setup-steps.yml"
      - ".github/workflows/docker-build.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/playwright.yml"
      - ".github/workflows/production-smoke.yml"
      - ".github/workflows/vercel-preview.yml"
  push:
    branches:
      - master
    paths:
      - "app/**"
      - "components/**"
      - "i18n/**"
      - "lib/**"
      - "messages/**"
      - "public/**/*.css"
      - "public/robots.txt"
      - "scripts/**"
      - "tests/**"
      - "unit-tests/**"
      - "*.{js,cjs,mjs,ts,json}"
      - "package-lock.json"
      - "CHANGELOG.md"
      - ".releaserc.yaml"
      - ".npmrc"
      - ".nvmrc"
      - ".envrc"
      - "mise.toml"
      - "AGENTS.md"
      - ".pre-commit-config.yaml"
      - ".pre-commit-pre-push.yaml"
      - ".github/copilot-instructions.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/copilot-setup-steps.yml"
      - ".github/workflows/docker-build.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/playwright.yml"
      - ".github/workflows/production-smoke.yml"
      - ".github/workflows/vercel-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check --quiet pre-commit==4.6.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Cache npm downloads
        id: npm-cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Pin npm
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          npm install --global npm@11.17.0 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run agent-first quality gate before build
        env:
          QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/master' }}
          QUALITY_LOG_TAIL: "120"
        run: bash scripts/agent-quality-gate.sh

      - name: Build Next.js production bundle
        run: npm run build

      # Avoid container-action image preparation when Snyk is disabled.
      # GitHub can prepare Docker actions before evaluating a step-level if.
      - name: Run Snyk vulnerability scan
        if: env.SNYK_TOKEN != ''
        run: npx --yes snyk test
