name: CI (Quality and Security)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app/**"
      - "components/**"
      - "i18n/**"
      - "lib/**"
      - "messages/**"
      - "public/**/*.css"
      - "public/robots.txt"
      - "scripts/**"
      - "tests/**"
      - "unit-tests/**"
      - "*.{js,cjs,mjs,ts,json}"
      - "package-lock.json"
      - "CHANGELOG.md"
      - ".releaserc.yaml"
      - ".npmrc"
      - ".nvmrc"
      - ".nvmrc-production"
      - ".python-version"
      - ".envrc"
      - "mise.toml"
      - "AGENTS.md"
      - ".pre-commit-config.yaml"
      - ".pre-commit-pre-push.yaml"
      - ".github/copilot-instructions.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/ci-policy.yml"
      - ".github/workflows/copilot-setup-steps.yml"
      - ".github/workflows/docker-build.yml"
      - ".github/workflows/node24-compat.yml"
      - ".github/workflows/post-merge-quality-remediation.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/playwright.yml"
      - ".github/workflows/production-smoke.yml"
      - ".github/workflows/production-dast.yml"
      - ".github/workflows/vercel-preview.yml"
      - ".github/workflows/zap-preview.yml"
      - ".zap/**"
  push:
    branches:
      - master
    paths:
      - "app/**"
      - "components/**"
      - "i18n/**"
      - "lib/**"
      - "messages/**"
      - "public/**/*.css"
      - "public/robots.txt"
      - "scripts/**"
      - "tests/**"
      - "unit-tests/**"
      - "*.{js,cjs,mjs,ts,json}"
      - "package-lock.json"
      - "CHANGELOG.md"
      - ".releaserc.yaml"
      - ".npmrc"
      - ".nvmrc"
      - ".nvmrc-production"
      - ".python-version"
      - ".envrc"
      - "mise.toml"
      - "AGENTS.md"
      - ".pre-commit-config.yaml"
      - ".pre-commit-pre-push.yaml"
      - ".github/copilot-instructions.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/ci-policy.yml"
      - ".github/workflows/copilot-setup-steps.yml"
      - ".github/workflows/docker-build.yml"
      - ".github/workflows/node24-compat.yml"
      - ".github/workflows/post-merge-quality-remediation.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/playwright.yml"
      - ".github/workflows/production-smoke.yml"
      - ".github/workflows/production-dast.yml"
      - ".github/workflows/vercel-preview.yml"
      - ".github/workflows/zap-preview.yml"
      - ".zap/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      current-base-sha: ${{ steps.production-baseline.outputs.base-sha }}
      preview_required: ${{ steps.ci-scope.outputs.preview_required }}
      zap_bootstrap: ${{ steps.ci-scope.outputs.zap_bootstrap }}
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Resolve current PR base and production branch heads
        id: production-baseline
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const baseRef = context.payload.pull_request.base.ref;
            const { data: baseBranch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: baseRef,
            });
            const baseSha = baseBranch.commit.sha;
            core.setOutput('base-sha', baseSha);
            core.info('Resolved current PR base ' + baseRef + ' HEAD to ' + baseSha);

            const productionRef = context.payload.repository.default_branch;
            const { data: productionBranch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: productionRef,
            });
            const productionSha = productionBranch.commit.sha;
            core.setOutput('production-sha', productionSha);
            core.info(
              'Resolved current production branch ' +
                productionRef +
                ' HEAD to ' +
                productionSha,
            );

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify current production baseline before PR build
        id: verified-production-baseline
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ steps.production-baseline.outputs.production-sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUALITY_BASELINE_RELEASE_HOPS: "3"
          QUALITY_BASELINE_MAINTENANCE_HOPS: "5"
        run: bash scripts/verify-production-baseline.sh

      - name: Classify CI change scope
        id: ci-scope
        env:
          BASE_SHA: ${{ steps.production-baseline.outputs.base-sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: bash scripts/ci-scope.sh "${BASE_SHA}" "${HEAD_SHA}"

      - name: Revalidate canonical production smoke before PR build
        if: github.event_name == 'pull_request'
        env:
          PRODUCTION_SHA: ${{ steps.verified-production-baseline.outputs.baseline_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_URL: "https://www.albanandrieu.com"
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is required for the pre-merge production smoke."
            exit 1
          fi

          baseline_smoke="${RUNNER_TEMP}/post-deploy-smoke.baseline.mjs"
          baseline_log="${RUNNER_TEMP}/post-deploy-smoke.baseline.log"
          candidate_smoke="${GITHUB_WORKSPACE}/scripts/post-deploy-smoke.mjs"
          git show "${PRODUCTION_SHA}:scripts/post-deploy-smoke.mjs" > "$baseline_smoke"

          set +e
          DEPLOYED_SHA="$PRODUCTION_SHA" node "$baseline_smoke" "$BASE_URL" 2>&1 | tee "$baseline_log"
          baseline_status="${PIPESTATUS[0]}"
          set -e
          if [[ "$baseline_status" -eq 0 ]]; then
            exit 0
          fi

          expected_failure="Production post-deploy smoke failed: Error: /api/homelab-status returned HTTP 503"
          if ! grep -Fq "$expected_failure" "$baseline_log"; then
            echo "::error::Canonical production smoke failed outside the reviewed homelab degraded transition."
            exit "$baseline_status"
          fi

          required_evidence=(
            "PASS /api/deployment ${PRODUCTION_SHA}"
            "PASS page /"
            "PASS page /fr"
            "PASS page /truenas"
            "PASS page /fr/truenas"
            "PASS page /architecture"
            "PASS page /fr/architecture"
            "PASS page /contact"
            "PASS page /fr/contact"
            "PASS sitemap.xml"
            "PASS robots.txt"
          )
          for evidence in "${required_evidence[@]}"; do
            if ! grep -Fq "$evidence" "$baseline_log"; then
              echo "::error::Canonical production smoke did not prove required evidence before the homelab 503: $evidence"
              exit "$baseline_status"
            fi
          done

          if [[ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]]; then
            echo "::error::Candidate smoke checkout does not match the exact PR HEAD."
            exit 1
          fi
          if git diff --quiet "$PRODUCTION_SHA" "$HEAD_SHA" -- scripts/post-deploy-smoke.mjs; then
            echo "::error::Canonical smoke failed on homelab 503 but this PR does not update the smoke policy."
            exit "$baseline_status"
          fi
          if ! grep -Fq 'WARN /api/homelab-status degraded: FastAPI upstream unavailable (' "$candidate_smoke"; then
            echo "::error::Candidate smoke is missing the reviewed homelab degraded-state contract."
            exit 1
          fi

          echo "::warning::Canonical smoke hit the reviewed homelab 503 transition; validating the candidate smoke against the same production SHA."
          DEPLOYED_SHA="$PRODUCTION_SHA" node "$candidate_smoke" "$BASE_URL"
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"

      - name: Restore pre-commit environments
        id: pre-commit-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', '.python-version') }}

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check --quiet pre-commit==4.6.2

      - name: Run canonical changed-file quality gate before SAST/npm bootstrap
        id: canonical-quality-gate
        continue-on-error: true
        env:
          QUALITY_BASE_REF: ${{ steps.production-baseline.outputs.base-sha || github.event.before || 'origin/master' }}
          QUALITY_LOG_TAIL: "40"
        run: bash scripts/quality-gate.sh

      - name: Save pre-commit environments
        if: steps.pre-commit-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', '.python-version') }}

      - name: Enforce canonical changed-file quality gate
        if: steps.canonical-quality-gate.outcome != 'success'
        run: exit 1

      - name: Run Semgrep SAST on changed source
        id: semgrep-sast
        if: steps.ci-scope.outputs.sast == 'true'
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.production-baseline.outputs.base-sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${BASE_SHA:-}"
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]] || [[ "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "$HEAD_SHA^")"
          fi
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$base_sha" "$HEAD_SHA" |
              grep -E '^(app|components|i18n|lib|scripts|api)/.*\.(cjs|js|jsx|mjs|py|ts|tsx)$|^\.github/workflows/.*\.ya?ml$|^(next\.config\.mjs|proxy\.ts)$' || true
          )
          if (("${#files[@]}" == 0)); then
            echo "No changed application or workflow source files require Semgrep."
            exit 0
          fi
          printf 'Semgrep SAST targets:\n%s\n' "${files[@]}"
          docker run --rm \
            --env SEMGREP_SEND_METRICS=off \
            --volume "$PWD:/src" \
            --workdir /src \
            semgrep/semgrep@sha256:12672acdb0949e19f9f6a4c2b288edd0b404f268f0ca7738a2c06f372f50362e \
            semgrep scan \
            --config p/ci \
            --error \
            --metrics=off \
            --sarif \
            --output /src/semgrep.sarif \
            "${files[@]}"

      - name: Upload Semgrep SARIF to GitHub Code Scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: "semgrep.sarif"
          category: "semgrep-pr"

      - name: Preserve failed Semgrep SAST report
        if: always() && steps.semgrep-sast.outcome != 'success' && hashFiles('semgrep.sarif') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: semgrep-sast-report
          path: semgrep.sarif
          retention-days: 7
          if-no-files-found: error

      - name: Clean Semgrep SAST workspace
        if: always() && hashFiles('semgrep.sarif') != ''
        shell: bash
        run: rm -f semgrep.sarif

      - name: Enforce Semgrep SAST
        if: steps.ci-scope.outputs.sast == 'true' && steps.semgrep-sast.outcome != 'success'
        run: exit 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Restore npm downloads
        id: npm-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Pin npm
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          npm install --global npm@11.17.0 --no-audit --no-fund

      - name: Install dependencies
        id: install
        shell: bash
        run: |
          set -euo pipefail
          start_ms="$(date +%s%3N)"
          npm ci --no-audit --no-fund
          end_ms="$(date +%s%3N)"
          elapsed_ms=$((end_ms - start_ms))
          npm_ci_seconds="$(awk -v ms="${elapsed_ms}" 'BEGIN { printf "%.3f", ms / 1000 }')"
          node_modules_mb="$(du -sm node_modules | awk '{print $1}')"
          echo "npm_ci_seconds=${npm_ci_seconds}" >>"${GITHUB_OUTPUT}"
          echo "node_modules_mb=${node_modules_mb}" >>"${GITHUB_OUTPUT}"

      - name: Restore Next.js build cache
        id: next-cache
        if: steps.ci-scope.outputs.build == 'true'
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ github.event.pull_request.number || github.ref_name }}
          restore-keys: |
            next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-

      - name: Save npm downloads
        if: steps.npm-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Run agent-first quality gate before build
        id: agent-quality-gate
        continue-on-error: true
        env:
          QUALITY_BASE_REF: ${{ steps.production-baseline.outputs.base-sha || github.event.before || 'origin/master' }}
          QUALITY_LOG_TAIL: "40"
          QUALITY_CANONICAL_GATE_VERIFIED: "1"
        shell: bash
        run: |
          set +e
          start_ms="$(date +%s%3N)"
          bash scripts/agent-quality-gate.sh
          rc=$?
          end_ms="$(date +%s%3N)"
          set -e
          elapsed_ms=$((end_ms - start_ms))
          agent_gate_seconds="$(awk -v ms="${elapsed_ms}" 'BEGIN { printf "%.3f", ms / 1000 }')"
          echo "agent_gate_seconds=${agent_gate_seconds}" >>"${GITHUB_OUTPUT}"
          exit "${rc}"

      - name: Enforce agent-first quality gate
        if: steps.agent-quality-gate.outcome != 'success'
        run: exit 1

      - name: Build Next.js production bundle
        id: next-build
        if: steps.ci-scope.outputs.build == 'true'
        shell: bash
        run: |
          set +e
          start_ms="$(date +%s%3N)"
          npm run build
          rc=$?
          end_ms="$(date +%s%3N)"
          set -e
          elapsed_ms=$((end_ms - start_ms))
          next_build_seconds="$(awk -v ms="${elapsed_ms}" 'BEGIN { printf "%.3f", ms / 1000 }')"
          next_mb=""
          if [[ -d .next ]]; then
            next_mb="$(du -sm .next | awk '{print $1}')"
          fi
          echo "next_build_seconds=${next_build_seconds}" >>"${GITHUB_OUTPUT}"
          echo "next_mb=${next_mb}" >>"${GITHUB_OUTPUT}"
          exit "${rc}"

      - name: Check CI performance warning budgets
        if: always()
        shell: bash
        env:
          NPM_CI_SECONDS: ${{ steps.install.outputs.npm_ci_seconds }}
          NODE_MODULES_MB: ${{ steps.install.outputs.node_modules_mb }}
          AGENT_GATE_SECONDS: ${{ steps.agent-quality-gate.outputs.agent_gate_seconds }}
          NEXT_BUILD_SECONDS: ${{ steps.next-build.outputs.next_build_seconds }}
          NEXT_MB: ${{ steps.next-build.outputs.next_mb }}
          NPM_CACHE_HIT: ${{ steps.npm-cache.outputs.cache-hit }}
          NEXT_CACHE_HIT: ${{ steps.next-cache.outputs.cache-hit }}
          SAST_REQUIRED: ${{ steps.ci-scope.outputs.sast }}
          BUILD_REQUIRED: ${{ steps.ci-scope.outputs.build }}
        run: bash scripts/ci-performance-budget.sh

      - name: Save Next.js build cache
        if: steps.ci-scope.outputs.build == 'true' && steps.next-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ github.event.pull_request.number || github.ref_name }}

      # Avoid container-action image preparation when Snyk is disabled.
      # GitHub can prepare Docker actions before evaluating a step-level if.
      - name: Run Snyk vulnerability scan
        if: env.SNYK_TOKEN != ''
        run: npx --yes snyk test

  preview-security:
    name: Vercel Preview security gates
    needs: quality
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.quality.result == 'success' &&
      needs.quality.outputs.preview_required == 'true'
    timeout-minutes: 35
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      statuses: write

    steps:
      - name: Resolve automatic Preview checkpoint
        id: preview
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const headSha = process.env.HEAD_SHA;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.state !== 'open') {
              core.setFailed(`PR #${prNumber} is not open.`);
              return;
            }
            if (pr.draft) {
              core.setFailed(`PR #${prNumber} returned to draft before Preview publication.`);
              return;
            }
            if (pr.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo) {
              core.setFailed('Automatic Preview checkpoints are limited to branches from this repository.');
              return;
            }
            if (pr.head.sha !== headSha) {
              core.setFailed(
                `PR #${prNumber} head moved from ${headSha} to ${pr.head.sha}; a newer Quality run must publish the checkpoint.`,
              );
              return;
            }

            core.setOutput('sha', headSha);
            core.setOutput('branch', `vercel-preview-pr-${prNumber}`);
            core.info(
              `Canonical Quality scope requires automatic Preview for PR #${prNumber}.`,
            );

      - name: Checkout exact PR revision for Preview
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.preview.outputs.sha }}
          fetch-depth: 0

      - name: Push automatic Vercel Preview checkpoint
        env:
          CHECKPOINT_BRANCH: ${{ steps.preview.outputs.branch }}
          PR_BASE_SHA: ${{ needs.quality.outputs.current-base-sha }}
        shell: bash
        run: >-
          bash scripts/publish-vercel-preview-checkpoint.sh
          "${CHECKPOINT_BRANCH}" "${PR_BASE_SHA}" HEAD

      - name: Wait for Vercel, Playwright and ZAP Preview statuses
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          STATUS_SHA: ${{ steps.preview.outputs.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ZAP_BOOTSTRAP: ${{ needs.quality.outputs.zap_bootstrap }}
        with:
          retries: 3
          script: |
            const sha = process.env.STATUS_SHA;
            const prNumber = Number(process.env.PR_NUMBER);
            const expected =
              process.env.ZAP_BOOTSTRAP === 'true'
                ? new Set(['Vercel', 'Playwright Preview E2E'])
                : new Set([
                    'Vercel',
                    'Playwright Preview E2E',
                    'OWASP ZAP Preview',
                  ]);

            if (process.env.ZAP_BOOTSTRAP === 'true') {
              core.warning(
                'This PR changes zap-preview.yml. repository_dispatch uses the default-branch workflow, so the new ZAP definition cannot be runtime-validated from this PR. The exact Vercel Preview and Playwright remain required; the stale master ZAP result is allowed to settle and is then replaced by an explicit deferred/bootstrap status.',
              );
            }
            const deadline = Date.now() + 25 * 60 * 1000;
            const vercelRegistrationDeadline = Date.now() + 2 * 60 * 1000;

            while (Date.now() < deadline) {
              const { data: livePr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });

              if (livePr.head.sha !== sha) {
                core.info(
                  `PR #${prNumber} moved from ${sha} to ${livePr.head.sha}; stop waiting on stale Preview statuses.`,
                );
                return;
              }

              const { data } = await github.rest.repos.listCommitStatusesForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                per_page: 100,
              });

              const latest = new Map();
              for (const status of data) {
                if (!latest.has(status.context)) {
                  latest.set(status.context, status);
                }
              }

              const summary = [...expected].map((context) => {
                const status = latest.get(context);
                return `${context}=${status?.state ?? 'absent'}`;
              });
              core.info(`Preview security statuses: ${summary.join(', ')}`);

              const vercelStatus = latest.get('Vercel');
              if (!vercelStatus && Date.now() >= vercelRegistrationDeadline) {
                core.setFailed(
                  `Vercel status was not registered within 2 minutes for ${sha}; no Preview deployment evidence was created.`,
                );
                return;
              }

              for (const context of expected) {
                const status = latest.get(context);
                if (status && ['failure', 'error'].includes(status.state)) {
                  core.setFailed(
                    `${context} failed for ${sha}: ${status.description ?? status.state}`,
                  );
                  return;
                }
              }

              if (
                [...expected].every(
                  (context) => latest.get(context)?.state === 'success',
                )
              ) {
                core.summary
                  .addHeading('Preview security gates')
                  .addList([
                    `Exact SHA: ${sha}`,
                    'Vercel Preview: success',
                    'Playwright Preview E2E: success',
                    process.env.ZAP_BOOTSTRAP === 'true'
                      ? 'OWASP ZAP Preview: deferred (workflow bootstrap; no new scanner claim)'
                      : 'OWASP ZAP Preview: success',
                  ]);
                await core.summary.write();
                return;
              }

              await new Promise((resolve) => setTimeout(resolve, 15000));
            }

            core.setFailed(
              `Timed out waiting for ${[...expected].join(' and ')} on ${sha}.`,
            );

      - name: Publish deferred ZAP workflow-bootstrap status
        if: needs.quality.outputs.zap_bootstrap == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          STATUS_SHA: ${{ steps.preview.outputs.sha }}
        with:
          script: |
            const sha = process.env.STATUS_SHA;
            const contextName = 'OWASP ZAP Preview';
            const started = Date.now();
            const deadline = started + 3 * 60 * 1000;

            while (Date.now() < deadline) {
              const { data } = await github.rest.repos.listCommitStatusesForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                per_page: 100,
              });
              const status = data.find((item) => item.context === contextName);

              if (status && status.state !== 'pending') {
                core.info(
                  `Observed stale default-branch ZAP status ${status.state}; replacing it with an explicit workflow-bootstrap defer.`,
                );
                break;
              }
              if (!status && Date.now() - started > 30000) {
                core.info('No stale ZAP status appeared during the bootstrap grace period.');
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'success',
              context: contextName,
              description: 'Deferred: ZAP workflow bootstrap; Playwright passed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.notice(
              'OWASP ZAP Preview is explicitly deferred for this workflow-bootstrap PR; no new ZAP scan result is claimed.',
            );
