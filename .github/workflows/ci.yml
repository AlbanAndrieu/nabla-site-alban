name: CI (Quality and Security)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app/**"
      - "components/**"
      - "i18n/**"
      - "lib/**"
      - "messages/**"
      - "public/**/*.css"
      - "public/robots.txt"
      - "scripts/**"
      - "tests/**"
      - "unit-tests/**"
      - "*.{js,cjs,mjs,ts,json}"
      - "package-lock.json"
      - "CHANGELOG.md"
      - ".releaserc.yaml"
      - ".npmrc"
      - ".nvmrc"
      - ".nvmrc-production"
      - ".python-version"
      - ".envrc"
      - "mise.toml"
      - "AGENTS.md"
      - ".pre-commit-config.yaml"
      - ".pre-commit-pre-push.yaml"
      - ".github/copilot-instructions.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/copilot-setup-steps.yml"
      - ".github/workflows/docker-build.yml"
      - ".github/workflows/node24-compat.yml"
      - ".github/workflows/post-merge-quality-remediation.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/playwright.yml"
      - ".github/workflows/production-smoke.yml"
      - ".github/workflows/production-dast.yml"
      - ".github/workflows/vercel-preview.yml"
      - ".github/workflows/zap-preview.yml"
      - ".zap/**"
  push:
    branches:
      - master
    paths:
      - "app/**"
      - "components/**"
      - "i18n/**"
      - "lib/**"
      - "messages/**"
      - "public/**/*.css"
      - "public/robots.txt"
      - "scripts/**"
      - "tests/**"
      - "unit-tests/**"
      - "*.{js,cjs,mjs,ts,json}"
      - "package-lock.json"
      - "CHANGELOG.md"
      - ".releaserc.yaml"
      - ".npmrc"
      - ".nvmrc"
      - ".nvmrc-production"
      - ".python-version"
      - ".envrc"
      - "mise.toml"
      - "AGENTS.md"
      - ".pre-commit-config.yaml"
      - ".pre-commit-pre-push.yaml"
      - ".github/copilot-instructions.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/copilot-setup-steps.yml"
      - ".github/workflows/docker-build.yml"
      - ".github/workflows/node24-compat.yml"
      - ".github/workflows/post-merge-quality-remediation.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/playwright.yml"
      - ".github/workflows/production-smoke.yml"
      - ".github/workflows/production-dast.yml"
      - ".github/workflows/vercel-preview.yml"
      - ".github/workflows/zap-preview.yml"
      - ".zap/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Resolve current PR base and production branch heads
        id: production-baseline
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const baseRef = context.payload.pull_request.base.ref;
            const { data: baseBranch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: baseRef,
            });
            const baseSha = baseBranch.commit.sha;
            core.setOutput('base-sha', baseSha);
            core.info('Resolved current PR base ' + baseRef + ' HEAD to ' + baseSha);

            const productionRef = context.payload.repository.default_branch;
            const { data: productionBranch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: productionRef,
            });
            const productionSha = productionBranch.commit.sha;
            core.setOutput('production-sha', productionSha);
            core.info(
              'Resolved current production branch ' +
                productionRef +
                ' HEAD to ' +
                productionSha,
            );

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify current production baseline before PR build
        id: verified-production-baseline
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ steps.production-baseline.outputs.production-sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUALITY_BASELINE_RELEASE_HOPS: "3"
          QUALITY_BASELINE_MAINTENANCE_HOPS: "5"
        run: bash scripts/verify-production-baseline.sh

      - name: Classify CI change scope
        id: ci-scope
        env:
          BASE_SHA: ${{ steps.production-baseline.outputs.base-sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: bash scripts/ci-scope.sh "${BASE_SHA}" "${HEAD_SHA}"

      - name: Revalidate canonical production smoke before PR build
        if: github.event_name == 'pull_request'
        env:
          PRODUCTION_SHA: ${{ steps.verified-production-baseline.outputs.baseline_sha }}
          BASE_URL: "https://www.albanandrieu.com"
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is required for the pre-merge production smoke."
            exit 1
          fi
          smoke_script="${RUNNER_TEMP}/post-deploy-smoke.mjs"
          git show "${PRODUCTION_SHA}:scripts/post-deploy-smoke.mjs" > "$smoke_script"
          DEPLOYED_SHA="$PRODUCTION_SHA" node "$smoke_script" "$BASE_URL"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"

      - name: Restore pre-commit environments
        id: pre-commit-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', '.python-version') }}

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check --quiet pre-commit==4.6.2

      - name: Run canonical changed-file quality gate before SAST/npm bootstrap
        id: canonical-quality-gate
        continue-on-error: true
        env:
          QUALITY_BASE_REF: ${{ steps.production-baseline.outputs.base-sha || github.event.before || 'origin/master' }}
          QUALITY_LOG_TAIL: "40"
        run: bash scripts/quality-gate.sh

      - name: Save pre-commit environments
        if: steps.pre-commit-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', '.python-version') }}

      - name: Enforce canonical changed-file quality gate
        if: steps.canonical-quality-gate.outcome != 'success'
        run: exit 1

      - name: Run Semgrep SAST on changed source
        id: semgrep-sast
        if: steps.ci-scope.outputs.sast == 'true'
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.production-baseline.outputs.base-sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${BASE_SHA:-}"
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]] || [[ "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "$HEAD_SHA^")"
          fi
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$base_sha" "$HEAD_SHA" |
              grep -E '^(app|components|i18n|lib|scripts|api)/.*\.(cjs|js|jsx|mjs|py|ts|tsx)$|^\.github/workflows/.*\.ya?ml$|^(next\.config\.mjs|proxy\.ts)$' || true
          )
          if (("${#files[@]}" == 0)); then
            echo "No changed application or workflow source files require Semgrep."
            exit 0
          fi
          printf 'Semgrep SAST targets:\n%s\n' "${files[@]}"
          docker run --rm \
            --env SEMGREP_SEND_METRICS=off \
            --volume "$PWD:/src" \
            --workdir /src \
            semgrep/semgrep@sha256:12672acdb0949e19f9f6a4c2b288edd0b404f268f0ca7738a2c06f372f50362e \
            semgrep scan \
            --config p/ci \
            --error \
            --metrics=off \
            --sarif \
            --output /src/semgrep.sarif \
            "${files[@]}"

      - name: Upload Semgrep SARIF to GitHub Code Scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: "semgrep.sarif"
          category: "semgrep-pr"

      - name: Preserve failed Semgrep SAST report
        if: always() && steps.semgrep-sast.outcome != 'success' && hashFiles('semgrep.sarif') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: semgrep-sast-report
          path: semgrep.sarif
          retention-days: 7
          if-no-files-found: error

      - name: Clean Semgrep SAST workspace
        if: always() && hashFiles('semgrep.sarif') != ''
        shell: bash
        run: rm -f semgrep.sarif

      - name: Enforce Semgrep SAST
        if: steps.ci-scope.outputs.sast == 'true' && steps.semgrep-sast.outcome != 'success'
        run: exit 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Restore npm downloads
        id: npm-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Pin npm
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          npm install --global npm@11.17.0 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore Next.js build cache
        id: next-cache
        if: steps.ci-scope.outputs.build == 'true'
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ github.event.pull_request.number || github.ref_name }}
          restore-keys: |
            next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-

      - name: Save npm downloads
        if: steps.npm-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Run agent-first quality gate before build
        id: agent-quality-gate
        continue-on-error: true
        env:
          QUALITY_BASE_REF: ${{ steps.production-baseline.outputs.base-sha || github.event.before || 'origin/master' }}
          QUALITY_LOG_TAIL: "40"
          QUALITY_CANONICAL_GATE_VERIFIED: "1"
        run: bash scripts/agent-quality-gate.sh

      - name: Enforce agent-first quality gate
        if: steps.agent-quality-gate.outcome != 'success'
        run: exit 1

      - name: Build Next.js production bundle
        if: steps.ci-scope.outputs.build == 'true'
        run: npm run build

      - name: Save Next.js build cache
        if: steps.ci-scope.outputs.build == 'true' && steps.next-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ github.event.pull_request.number || github.ref_name }}

      # Avoid container-action image preparation when Snyk is disabled.
      # GitHub can prepare Docker actions before evaluating a step-level if.
      - name: Run Snyk vulnerability scan
        if: env.SNYK_TOKEN != ''
        run: npx --yes snyk test

  preview-security:
    name: Vercel Preview security gates
    needs: quality
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.quality.result == 'success'
    timeout-minutes: 35
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      statuses: write

    steps:
      - name: Resolve automatic Preview checkpoint
        id: preview
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const headSha = process.env.HEAD_SHA;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.state !== 'open') {
              core.setFailed(`PR #${prNumber} is not open.`);
              return;
            }
            if (pr.draft) {
              core.setFailed(`PR #${prNumber} returned to draft before Preview publication.`);
              return;
            }
            if (pr.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo) {
              core.setFailed('Automatic Preview checkpoints are limited to branches from this repository.');
              return;
            }
            if (pr.head.sha !== headSha) {
              core.setFailed(
                `PR #${prNumber} head moved from ${headSha} to ${pr.head.sha}; a newer Quality run must publish the checkpoint.`,
              );
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const safeOnly = (filename) =>
              filename.startsWith('docs/') ||
              filename.endsWith('.md') ||
              filename.startsWith('unit-tests/') ||
              filename.startsWith('.github/') ||
              filename.startsWith('.zap/') ||
              filename.startsWith('.vscode/') ||
              filename.startsWith('.idea/') ||
              filename.startsWith('.agents/') ||
              filename.startsWith('.cursor/') ||
              filename.startsWith('.claude/') ||
              filename === '.assetsignore' ||
              filename === '.pre-commit-config.yaml' ||
              filename === '.pre-commit-pre-push.yaml' ||
              filename === '.python-version' ||
              filename === 'mise.toml' ||
              filename === 'eslint.config.js' ||
              filename === 'stylelint.config.cjs' ||
              filename === 'scripts/agent-quality-gate.sh' ||
              filename === 'scripts/ci-scope.sh' ||
              filename === 'scripts/verify-production-baseline.sh' ||
              filename === 'scripts/quality-gate.sh' ||
              filename === 'scripts/eslint-github-formatter.mjs';

            const deployRelevant = files
              .map((file) => file.filename)
              .filter((filename) => !safeOnly(filename));

            const zapBootstrap = files.some(
              (file) => file.filename === '.github/workflows/zap-preview.yml',
            );

            core.setOutput('sha', headSha);
            core.setOutput('branch', `vercel-preview-pr-${prNumber}`);
            core.setOutput(
              'deploy_relevant',
              deployRelevant.length > 0 ? 'true' : 'false',
            );
            core.setOutput('zap_bootstrap', zapBootstrap ? 'true' : 'false');

            if (deployRelevant.length === 0) {
              core.info(
                `PR #${prNumber} only changes tests/docs/maintenance; Preview security gates are not required.`,
              );
              return;
            }

            core.info(`Automatic Preview files: ${deployRelevant.join(', ')}`);

      - name: Report maintenance-only Preview skip
        if: steps.preview.outputs.deploy_relevant != 'true'
        shell: bash
        run: |
          {
            echo "## Preview security gates"
            echo
            echo "No deploy-relevant files: Vercel Preview, Playwright and ZAP are intentionally skipped."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout exact PR revision for Preview
        if: steps.preview.outputs.deploy_relevant == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.preview.outputs.sha }}
          fetch-depth: 0

      - name: Push automatic Vercel Preview checkpoint
        if: steps.preview.outputs.deploy_relevant == 'true'
        env:
          CHECKPOINT_BRANCH: ${{ steps.preview.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin "HEAD:refs/heads/${CHECKPOINT_BRANCH}"
          echo "Published ${CHECKPOINT_BRANCH} at $(git rev-parse HEAD)."

      - name: Wait for Vercel, Playwright and ZAP Preview statuses
        if: steps.preview.outputs.deploy_relevant == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          STATUS_SHA: ${{ steps.preview.outputs.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ZAP_BOOTSTRAP: ${{ steps.preview.outputs.zap_bootstrap }}
        with:
          script: |
            const sha = process.env.STATUS_SHA;
            const prNumber = Number(process.env.PR_NUMBER);
            const expected =
              process.env.ZAP_BOOTSTRAP === 'true'
                ? new Set(['Vercel', 'Playwright Preview E2E'])
                : new Set([
                    'Vercel',
                    'Playwright Preview E2E',
                    'OWASP ZAP Preview',
                  ]);

            if (process.env.ZAP_BOOTSTRAP === 'true') {
              core.warning(
                'This PR changes zap-preview.yml. repository_dispatch uses the default-branch workflow, so the new ZAP definition cannot be runtime-validated from this PR. The exact Vercel Preview and Playwright remain required; the stale master ZAP result is allowed to settle and is then replaced by an explicit deferred/bootstrap status.',
              );
            }
            const deadline = Date.now() + 25 * 60 * 1000;
            const vercelRegistrationDeadline = Date.now() + 2 * 60 * 1000;

            while (Date.now() < deadline) {
              const { data: livePr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });

              if (livePr.head.sha !== sha) {
                core.info(
                  `PR #${prNumber} moved from ${sha} to ${livePr.head.sha}; stop waiting on stale Preview statuses.`,
                );
                return;
              }

              const { data } = await github.rest.repos.listCommitStatusesForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                per_page: 100,
              });

              const latest = new Map();
              for (const status of data) {
                if (!latest.has(status.context)) {
                  latest.set(status.context, status);
                }
              }

              const summary = [...expected].map((context) => {
                const status = latest.get(context);
                return `${context}=${status?.state ?? 'absent'}`;
              });
              core.info(`Preview security statuses: ${summary.join(', ')}`);

              const vercelStatus = latest.get('Vercel');
              if (!vercelStatus && Date.now() >= vercelRegistrationDeadline) {
                core.setFailed(
                  `Vercel status was not registered within 2 minutes for ${sha}; no Preview deployment evidence was created.`,
                );
                return;
              }

              for (const context of expected) {
                const status = latest.get(context);
                if (status && ['failure', 'error'].includes(status.state)) {
                  core.setFailed(
                    `${context} failed for ${sha}: ${status.description ?? status.state}`,
                  );
                  return;
                }
              }

              if (
                [...expected].every(
                  (context) => latest.get(context)?.state === 'success',
                )
              ) {
                core.summary
                  .addHeading('Preview security gates')
                  .addList([
                    `Exact SHA: ${sha}`,
                    'Vercel Preview: success',
                    'Playwright Preview E2E: success',
                    process.env.ZAP_BOOTSTRAP === 'true'
                      ? 'OWASP ZAP Preview: deferred (workflow bootstrap; no new scanner claim)'
                      : 'OWASP ZAP Preview: success',
                  ]);
                await core.summary.write();
                return;
              }

              await new Promise((resolve) => setTimeout(resolve, 15000));
            }

            core.setFailed(
              `Timed out waiting for ${[...expected].join(' and ')} on ${sha}.`,
            );

      - name: Publish deferred ZAP workflow-bootstrap status
        if: steps.preview.outputs.deploy_relevant == 'true' && steps.preview.outputs.zap_bootstrap == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          STATUS_SHA: ${{ steps.preview.outputs.sha }}
        with:
          script: |
            const sha = process.env.STATUS_SHA;
            const contextName = 'OWASP ZAP Preview';
            const started = Date.now();
            const deadline = started + 3 * 60 * 1000;

            while (Date.now() < deadline) {
              const { data } = await github.rest.repos.listCommitStatusesForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                per_page: 100,
              });
              const status = data.find((item) => item.context === contextName);

              if (status && status.state !== 'pending') {
                core.info(
                  `Observed stale default-branch ZAP status ${status.state}; replacing it with an explicit workflow-bootstrap defer.`,
                );
                break;
              }
              if (!status && Date.now() - started > 30000) {
                core.info('No stale ZAP status appeared during the bootstrap grace period.');
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'success',
              context: contextName,
              description: 'Deferred: ZAP workflow bootstrap; Playwright passed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.notice(
              'OWASP ZAP Preview is explicitly deferred for this workflow-bootstrap PR; no new ZAP scan result is claimed.',
            );
