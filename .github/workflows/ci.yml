name: CI (Quality and Security)

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "i18n/**"
      - "lib/**"
      - "messages/**"
      - "public/**/*.css"
      - "scripts/**"
      - "unit-tests/**"
      - "*.{js,cjs,mjs,ts,json}"
      - "package-lock.json"
      - "CHANGELOG.md"
      - ".releaserc.yaml"
      - ".npmrc"
      - ".nvmrc"
      - ".envrc"
      - "mise.toml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/playwright.yml"
      - ".github/workflows/vercel-preview.yml"
  push:
    branches:
      - master
    paths:
      - "app/**"
      - "components/**"
      - "i18n/**"
      - "lib/**"
      - "messages/**"
      - "public/**/*.css"
      - "scripts/**"
      - "unit-tests/**"
      - "*.{js,cjs,mjs,ts,json}"
      - "package-lock.json"
      - "CHANGELOG.md"
      - ".releaserc.yaml"
      - ".npmrc"
      - ".nvmrc"
      - ".envrc"
      - "mise.toml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/playwright.yml"
      - ".github/workflows/vercel-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "25"
          cache: npm

      - name: Normalize dependency lock on convergence branch
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/converge-bababou-tooling'
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already normalized."
            exit 0
          fi
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): normalize Node 25 lockfile"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Upgrade npm
        run: npm install --global npm@11.17.0 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint JavaScript and TypeScript
        run: npm run lint

      - name: Lint CSS
        run: npm run lint:css

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Build Next.js production bundle
        run: npm run build

      - name: Run Snyk vulnerability scan
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@master
        with:
          command: test
