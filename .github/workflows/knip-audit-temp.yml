name: Temporary Knip audit

on:
  push:
    branches:
      - chore/knip-dead-code-audit-20260908

permissions:
  contents: write

jobs:
  knip:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Pin npm
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          npm install --global npm@11.17.0 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run zero-config Knip audit
        continue-on-error: true
        run: npx --yes --ignore-scripts knip@6.35.0 --reporter compact --no-progress

      - name: Remove confirmed dead npm roots
        shell: bash
        run: |
          set -euo pipefail
          npm uninstall --package-lock-only --ignore-scripts \
            @stripe/react-stripe-js \
            @stripe/stripe-js \
            eslint-config-next \
            postcss-selector-parser \
            typescript-eslint
          git diff --check
          git diff -- package.json package-lock.json

      - name: Commit regenerated npm manifests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "perf(deps): remove confirmed dead npm roots"
          git push origin HEAD:chore/knip-dead-code-audit-20260908
