name: Temporary Knip audit

on:
  push:
    branches:
      - chore/knip-dead-code-audit-20260908

permissions:
  contents: read

jobs:
  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Pin npm
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          npm install --global npm@11.17.0 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run zero-config Knip audit
        run: npx --yes --ignore-scripts knip@6.35.0 --reporter compact --no-progress
