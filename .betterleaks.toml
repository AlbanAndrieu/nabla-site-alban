# Betterleaks v1.9.0 policy. Keep reviewed legacy allowlists until v2 migration.
# Extend the upstream rules rather than maintaining a replacement rule set.
title = "nabla-site-alban secrets policy"
betterleaksMinVersion = "v1.9.0"

[extend]
# Extend built-in Betterleaks detection rules.
useDefault = true

[allowlist]
description = "global allow lists"
regexes = [
    '''219-09-9999''',
    '''078-05-1120''',
    '''(9[0-9]{2}|666)-\d{2}-\d{4}''',
    '''#nosec''',
    '''betterleaks:allow''',
    '''password-reset-XXX''',
    '''sk-1234567890''',
    '''tg3zLMS/bebJFl0LxctiCw''',
      # Vercel data-key: value like tg3zLMS/bebJFl0LxctiCw (alphanumeric + slash)
  '''data-key=^[A-Za-z0-9]+/[A-Za-z0-9+/=]{10,70}$''',
    ]
paths = [
    '''betterleaks.toml''',
    '''(.*?)(jpg|gif|doc|docx|zip|xls|pdf|bin|svg|socket|vsidx|v2|suo|wsuo|.dll|pdb|exe)$''',
    '''(go.mod|go.sum|go.work|go.work.sum)$''',
    '''gradle.lockfile''',
    '''megalinter-reports''',
    '''node_modules''',
    '''.mypy_cache''',
    '''(.*?)gitleaks\.toml$''',
    '''vue-client/node_modules''',
    '''package-lock.json''',
    '''yarn.lock''',
    '''pnpm-lock.yaml''',
    '''Database.refactorlog''',
    '''vendor/''',
    '''.venv/''',
    '''.direnv/''',
    '''.tox/''',
    '''environment.yml''',
    '''.terraform''',
]
