# Betterleaks v1.9.0 policy. The reviewed legacy global allowlist is kept
# as-is in the [[allowlists]] format (default condition OR = legacy behavior).
# Extend the upstream rules rather than maintaining a replacement rule set.
title = "nabla-site-alban secrets policy"
betterleaksMinVersion = "v1.9.0"

[extend]
# Extend built-in Betterleaks detection rules.
useDefault = true

[[allowlists]]
description = "global allow lists"
regexes = [
    '''219-09-9999''',
    '''078-05-1120''',
    '''(9[0-9]{2}|666)-\d{2}-\d{4}''',
    '''#nosec''',
    '''betterleaks:allow''',
    '''password-reset-XXX''',
    '''sk-1234567890''',
    '''tg3zLMS/bebJFl0LxctiCw''',
      # Vercel data-key: value like tg3zLMS/bebJFl0LxctiCw (alphanumeric + slash)
  '''data-key=^[A-Za-z0-9]+/[A-Za-z0-9+/=]{10,70}$''',
    ]
paths = [
    '''betterleaks.toml''',
    '''(.*?)(jpg|gif|doc|docx|zip|xls|pdf|bin|svg|socket|vsidx|v2|suo|wsuo|.dll|pdb|exe)$''',
    '''(go.mod|go.sum|go.work|go.work.sum)$''',
    '''gradle.lockfile''',
    '''megalinter-reports''',
    '''node_modules''',
    '''.mypy_cache''',
    '''(.*?)gitleaks\.toml$''',
    '''vue-client/node_modules''',
    '''package-lock.json''',
    '''yarn.lock''',
    '''pnpm-lock.yaml''',
    '''Database.refactorlog''',
    '''vendor/''',
    '''.venv/''',
    '''.direnv/''',
    '''.tox/''',
    '''environment.yml''',
    '''.terraform''',
]

# Public client-side keys, shipped to every browser by design: an exception
# requires the expected rule AND file AND public key format, so a real secret
# added to the same file is still reported.
[[allowlists]]
description = "PostHog project key (phc_) is a public ingestion-only key"
targetRules = ["posthog-project-api-key"]
condition = "AND"
paths = ['''^public/site-analytics\.js$''']
regexes = ['''^phc_[A-Za-z0-9]{20,}$''']

[[allowlists]]
description = "Datadog RUM clientToken (pub...) is a public browser token"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^public/site-analytics\.js$''']
regexes = ['''^pub[0-9a-f]{32}$''']

[[allowlists]]
description = "Stripe publishable key (pk_) used by the public Buy Button"
targetRules = ["generic-api-key", "stripe-access-token"]
condition = "AND"
paths = [
    '''^public/checkout-tjm\.html$''',
    '''^app/\[locale\]/checkout-tjm/page\.tsx$''',
]
regexes = ['''^pk_(live|test)_[A-Za-z0-9]{20,}$''']

[[allowlists]]
description = "Commented DAST example credential, not a real password"
targetRules = ["generic-password"]
condition = "AND"
paths = ['''^\.gitlab-ci\.yml$''']
regexes = ['''^["“]?P@ssw0rd["”]?$''']

[[allowlists]]
description = "Local Next.js build output (git-ignored, never committed)"
paths = ['''(^|/)\.next/''']
