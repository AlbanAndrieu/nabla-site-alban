minimum_pre_commit_version: 4.2.0
repos:
  - repo: local
    hooks:
      - id: quality-gate-pre-push
        name: "✅ quality · Reuse or run exact publication proof before push"
        language: system
        entry: bash scripts/agent-publish.sh
        pass_filenames: false
        always_run: true
        stages: [pre-push]
