min_version = "2024.9.5"

[tools]
node = "25.9.0"
python = "{{ get_env(name='PYTHON_VERSION', default='3.13') }}"
pre-commit = "4.6.2"

[settings]
lockfile = true

[env]
_.file = [".env.secrets", ".env.local"]

ENV = "dev"

[tasks.hooks]
description = "Install canonical pre-commit, commit-msg and pre-push Git hooks"
run = '''
pre-commit install --install-hooks --hook-type pre-commit --hook-type commit-msg
pre-commit install --config .pre-commit-pre-push.yaml --install-hooks --hook-type pre-push
'''

[tasks.quality]
description = "Run the canonical publication quality gate"
run = "bash scripts/quality-gate.sh"

[tasks.agent-quality]
description = "Run the repo-specific agent-first pre-build gate"
run = "bash scripts/agent-quality-gate.sh"

[tasks.agent-fix]
description = "Apply deterministic pre-commit fixes on changed files"
run = "bash scripts/agent-quality-gate.sh --fix"

[tasks.agent-publish]
description = "Run or reuse the exact strict publication proof for the current HEAD/base/toolchain"
run = "bash scripts/agent-publish.sh"
